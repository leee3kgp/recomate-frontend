
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#151515">

    <title>RecoMate | 로그인</title>

    <link rel="stylesheet" href="../css/auth.css">

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            min-height: 100%;
        }

        body.login-page {
            position: relative;
            min-height: 100vh;
            overflow-x: hidden;
            background: #b85d65;
            color: #ffffff;
            font-family: Arial, "Noto Sans KR", sans-serif;
        }

        /* =====================================
           시안과 동일한 계열의 움직이는 배경
        ===================================== */

        body.login-page::before {
            content: "";
            position: fixed;
            inset: -15%;
            z-index: 0;
            pointer-events: none;

            background:
                radial-gradient(
                    ellipse 65% 85% at 8% 48%,
                    rgba(132, 54, 151, 0.95) 0%,
                    rgba(153, 65, 136, 0.65) 48%,
                    transparent 85%
                ),
                radial-gradient(
                    ellipse 65% 90% at 88% 50%,
                    rgba(241, 124, 13, 0.95) 0%,
                    rgba(226, 112, 31, 0.65) 55%,
                    transparent 90%
                ),
                linear-gradient(
                    110deg,
                    #90429b 0%,
                    #b45682 38%,
                    #c96758 65%,
                    #e47b1c 100%
                );

            animation: gradientMove 14s ease-in-out infinite alternate;
            will-change: transform;
        }

        @keyframes gradientMove {
            0% {
                transform: translateX(0%) scale(1);
            }

            50% {
                transform: translateX(-5%) scale(1.04);
            }

            100% {
                transform: translateX(5%) scale(1.08);
            }
        }

        /* =====================================
           로그인 화면 중앙 정렬
        ===================================== */

        .login-page .login-container {
            position: relative;
            z-index: 1;

            display: flex;
            align-items: center;
            justify-content: center;

            width: 100%;
            min-height: 100vh;
            margin: 0;
            padding: 35px 20px;

            background: transparent;
        }

        /* =====================================
           홈으로 돌아가기
        ===================================== */

        .login-page .home-back {
            position: fixed;
            top: 34%;
            left: 3.2%;
            z-index: 10;

            display: inline-flex;
            align-items: center;
            justify-content: center;

            padding: 9px 14px;

            border: none;
            border-radius: 30px;

            background: #151515;
            color: #ffffff;

            font-size: 14px;
            text-decoration: none;
            white-space: nowrap;
        }

        .login-page .home-back:hover {
            background: #292929;
            color: #ffffff;
        }

        /* =====================================
           로그인 카드
        ===================================== */

        .login-page .login-box {
            position: relative;
            width: 100%;
            max-width: 428px;

            margin: 0;
            padding: 34px 41px 30px;

            border: 1px solid #292929;
            border-radius: 11px;

            background: #141414;
            color: #ffffff;

            text-align: center;

            box-shadow: 0 18px 45px rgba(0, 0, 0, 0.12);
        }

        /* =====================================
           로고 및 설명
        ===================================== */

        .login-page .login-logo {
            margin: 0;

            background: linear-gradient(
                100deg,
                #a33caf 0%,
                #c45583 48%,
                #ed801a 100%
            );

            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;

            font-size: 36px;
            font-weight: 400;
            line-height: 1.35;
            letter-spacing: -1.1px;
        }

        .login-page .login-description {
            margin: 7px 0 27px;

            color: #999999;
            font-size: 13px;
            font-weight: 400;
            line-height: 1.6;
        }

        /* =====================================
           로그인 입력창
        ===================================== */

        .login-page .input-group {
            margin-bottom: 17px;
            text-align: left;
        }

        .login-page .login-label {
            display: block;
            margin-bottom: 7px;

            color: #bcbcbc;
            font-size: 12px;
            font-weight: 400;
            text-align: left;
        }

        .login-page .login-input {
            display: block;
            width: 100%;
            height: 44px;

            margin: 0;
            padding: 0 14px;

            border: 1px solid #393939;
            border-radius: 9px;
            outline: none;

            background: #000000;
            color: #ffffff;

            font-size: 14px;
        }

        .login-page .login-input::placeholder {
            color: #777777;
        }

        .login-page .login-input:focus {
            border-color: #b35a9a;
            box-shadow: 0 0 0 2px rgba(179, 90, 154, 0.15);
        }

        /* =====================================
           비밀번호 표시 버튼
        ===================================== */

        .login-page .password-wrapper {
            position: relative;
        }

        .login-page .password-wrapper .login-input {
            padding-right: 48px;
        }

        .login-page .password-toggle {
            position: absolute;
            top: 50%;
            right: 12px;
            transform: translateY(-50%);

            display: flex;
            align-items: center;
            justify-content: center;

            width: 24px;
            height: 24px;

            padding: 0;
            border: none;
            background: transparent;
            color: #999999;

            cursor: pointer;
        }

        .login-page .password-toggle svg {
            width: 19px;
            height: 19px;
            fill: none;
            stroke: currentColor;
            stroke-width: 1.7;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        /* =====================================
           로그인 버튼
        ===================================== */

        .login-page .login-button {
            display: block;
            width: 100%;
            height: 46px;

            margin-top: 40px;
            padding: 0;

            border: none;
            border-radius: 9px;

            background: linear-gradient(
                100deg,
                #a13bac 0%,
                #c45b7a 48%,
                #ef8013 100%
            );

            color: #ffffff;
            font-size: 15px;
            font-weight: 700;

            cursor: pointer;
        }

        .login-page .login-button:hover {
            filter: brightness(1.08);
        }

        .login-page .login-button:disabled {
            opacity: 0.65;
            cursor: not-allowed;
        }

        /* =====================================
           로그인 메시지
        ===================================== */

        .login-page .login-message {
            margin: 8px 0 0;
            color: #ff9999;
            font-size: 12px;
            text-align: center;
        }

        .login-page .login-message:empty {
            display: none;
        }

        /* =====================================
           회원가입
        ===================================== */

        .login-page .signup-area {
            margin-top: 19px;
            text-align: right;
        }

        .login-page .signup-link {
            color: #aaaaaa;
            font-size: 14px;
            font-weight: 400;
            text-decoration: underline;
            text-underline-offset: 4px;
        }

        .login-page .signup-link:hover {
            color: #ffffff;
        }

        /* =====================================
           반응형
        ===================================== */

        @media (max-width: 600px) {
            .login-page .login-container {
                padding: 80px 18px 30px;
            }

            .login-page .login-box {
                max-width: 428px;
                padding: 32px 26px 28px;
            }

            .login-page .home-back {
                top: 22px;
                left: 18px;
            }

            .login-page .login-logo {
                font-size: 33px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            body.login-page::before {
                animation: none;
            }
        }
    </style>
</head>

<body class="login-page">

    <!-- 홈 버튼 -->
    <a href="index.html" class="home-back">
        ← 홈
    </a>

    <main class="login-container">

        <section class="login-box">

            <h1 class="login-logo">
                RecoMate
            </h1>

            <p class="login-description">
                함께 볼 콘텐츠, 고민 없이
            </p>

            <form id="loginForm">

                <!-- 이메일 -->
                <div class="input-group">

                    <label for="userId" class="login-label">
                        이메일
                    </label>

                    <input
                        type="email"
                        id="userId"
                        class="login-input"
                        placeholder="email"
                        autocomplete="email"
                        required
                    >

                </div>

                <!-- 비밀번호 -->
                <div class="input-group">

                    <label for="password" class="login-label">
                        비밀번호
                    </label>

                    <div class="password-wrapper">

                        <input
                            type="password"
                            id="password"
                            class="login-input"
                            placeholder="password"
                            autocomplete="current-password"
                            required
                        >

                        <button
                            type="button"
                            class="password-toggle"
                            id="passwordToggle"
                            aria-label="비밀번호 표시"
                            aria-pressed="false"
                        >
                            <svg viewBox="0 0 24 24" aria-hidden="true">
                                <path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z"></path>
                                <circle cx="12" cy="12" r="3"></circle>
                            </svg>
                        </button>

                    </div>

                </div>

                <!-- 로그인 결과 -->
                <div
                    id="loginMessage"
                    class="login-message"
                    role="status"
                    aria-live="polite"
                ></div>

                <!-- 로그인 버튼 -->
                <button
                    type="submit"
                    id="loginButton"
                    class="login-button"
                >
                    login
                </button>

            </form>

            <!-- 회원가입 -->
            <div class="signup-area">
                <a href="signup.html" class="signup-link">
                    회원가입 하기
                </a>
            </div>

        </section>

    </main>

    <!-- 비밀번호 표시 기능 -->
    <script>
        const passwordInput = document.getElementById("password");
        const passwordToggle = document.getElementById("passwordToggle");

        passwordToggle.addEventListener("click", () => {
            const isPassword = passwordInput.type === "password";

            passwordInput.type = isPassword ? "text" : "password";

            passwordToggle.setAttribute(
                "aria-pressed",
                String(isPassword)
            );

            passwordToggle.setAttribute(
                "aria-label",
                isPassword ? "비밀번호 숨기기" : "비밀번호 표시"
            );
        });
    </script>

    <!-- 기존 Cognito 로그인 기능 유지 -->
    <script type="module" src="../js/login.js"></script>

</body>
</html>
