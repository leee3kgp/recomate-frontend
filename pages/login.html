
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#101014">

    <title>RecoMate | 로그인</title>

    <!-- Bootstrap 5 -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- 기존 인증 CSS -->
    <link rel="stylesheet" href="../css/auth.css">
</head>

<body class="login-page">

    <!-- 상단 로고 -->
    <header class="login-header">
        <a href="index.html" class="login-brand">
            RecoMate
        </a>
        <a href="index.html" class="login-home-link">
            홈으로 돌아가기
        </a>
    </header>

    <main class="login-container">

        <!-- 배경 영화 포스터 -->
        <div class="login-backdrop" aria-hidden="true">
            <div class="login-poster-grid">
                <div class="login-poster login-poster-1"></div>
                <div class="login-poster login-poster-2"></div>
                <div class="login-poster login-poster-3"></div>
                <div class="login-poster login-poster-4"></div>
                <div class="login-poster login-poster-5"></div>
                <div class="login-poster login-poster-6"></div>
                <div class="login-poster login-poster-7"></div>
                <div class="login-poster login-poster-8"></div>
                <div class="login-poster login-poster-9"></div>
                <div class="login-poster login-poster-10"></div>
            </div>
        </div>

        <div class="login-backdrop-overlay" aria-hidden="true"></div>

        <!-- 로그인 박스 -->
        <section class="login-box">

            <p class="login-eyebrow">
                YOUR MOVIE, OUR CHOICE
            </p>

            <h1 class="login-title">
                다시 만나서 반가워요!
            </h1>

            <p class="login-description">
                로그인하고 모두의 취향에 맞는<br>
                콘텐츠를 추천받아 보세요.
            </p>

            <form id="loginForm">

                <!-- 이메일 -->
                <div class="mb-3">
                    <label for="userId" class="login-label">
                        이메일
                    </label>

                    <input
                        type="email"
                        class="form-control login-input"
                        id="userId"
                        placeholder="이메일을 입력하세요"
                        autocomplete="email"
                        required
                    >
                </div>

                <!-- 비밀번호 -->
                <div class="mb-3">
                    <label for="password" class="login-label">
                        비밀번호
                    </label>

                    <input
                        type="password"
                        class="form-control login-input"
                        id="password"
                        placeholder="비밀번호를 입력하세요"
                        autocomplete="current-password"
                        required
                    >
                </div>

                <!-- 로그인 결과 메시지 -->
                <div
                    id="loginMessage"
                    class="login-message"
                    role="status"
                    aria-live="polite"
                ></div>

                <!-- 로그인 버튼 -->
                <button
                    type="submit"
                    id="loginButton"
                    class="btn login-button w-100"
                >
                    로그인하기
                </button>

            </form>

            <div class="login-divider">
                <span>아직 RecoMate 회원이 아니신가요?</span>
            </div>

            <!-- 회원가입 -->
            <div class="signup-area">
                <a href="signup.html" class="signup-link">
                    회원가입하기
                </a>
            </div>

        </section>
    </main>

    <footer class="login-footer">
        <p>
            RecoMate · 함께 고르는 콘텐츠
        </p>
        <p>
            영화 및 TV 콘텐츠 정보 제공: TMDB
        </p>
    </footer>

    <!-- 기존 Cognito 로그인 기능 -->
    <script type="module" src="../js/login.js"></script>

</body>
</html>
