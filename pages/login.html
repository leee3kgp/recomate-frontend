
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>RecoMate 로그인</title>

    <!-- Bootstrap 5 -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- 기존 CSS -->
    <link rel="stylesheet" href="../css/auth.css">

    <style>
        .login-message {
            margin-bottom: 15px;
            font-size: 13px;
            text-align: center;
        }

        .login-message.error {
            color: #dc3545;
        }

        .login-message.success {
            color: #198754;
        }
    </style>
</head>

<body>

    <main class="login-container">

        <div class="login-box">

            <h1 class="logo">RecoMate</h1>

            <form id="loginForm">

                <!-- 이메일 -->
                <div class="mb-3">
                    <input
                        type="email"
                        class="form-control login-input"
                        id="userId"
                        placeholder="아이디(이메일)를 입력하세요"
                        autocomplete="email"
                        required
                    >
                </div>

                <!-- 비밀번호 -->
                <div class="mb-4">
                    <input
                        type="password"
                        class="form-control login-input"
                        id="password"
                        placeholder="비밀번호를 입력하세요"
                        autocomplete="current-password"
                        required
                    >
                </div>

                <!-- 로그인 결과 -->
                <div
                    id="loginMessage"
                    class="login-message"
                    role="status"
                    aria-live="polite"
                ></div>

                <!-- 로그인 버튼 -->
                <button
                    type="submit"
                    id="loginButton"
                    class="btn login-button w-100"
                >
                    로그인하기
                </button>

            </form>

            <!-- 회원가입 -->
            <div class="signup-area">
                <a href="signup.html" class="signup-link">
                    회원가입하기
                </a>
            </div>

        </div>

    </main>

    <!-- 반드시 type="module" 사용 -->
    <script type="module" src="../js/login.js"></script>

</body>
</html>
