
<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#141414">
  <title>로그인 | RecoMate</title>

  <link rel="stylesheet" href="../css/recomate-design.css">
</head>

<body data-page="login">

  <a class="sr-only" href="#main">본문 바로가기</a>

  <!-- 상단 네비게이션 -->
  <header class="site-header" id="site-header">
    <div class="container">
      <a class="logo" href="index.html" aria-label="RecoMate 홈">
        <span>🎟</span> RecoMate
      </a>

      <nav class="main-nav" aria-label="주요 메뉴">
        <a href="start.html">같이 추천받기</a>
      </nav>

      <div class="header-actions">
        <a class="btn btn-ghost btn-sm" href="login.html">
          로그인
        </a>
        <a class="btn btn-primary btn-sm" href="signup.html">
          회원가입
        </a>
      </div>
    </div>
  </header>

  <!-- 로그인 화면 -->
  <main id="main" class="auth">
    <div class="auth-card">
      <div class="card">

        <div class="auth-head">
          <a class="logo" href="index.html">
            <span>RecoMate</span>
          </a>

          <h1>로그인</h1>

          <p class="muted" style="margin:0">
            로그인하고 함께 볼 영화·드라마를 추천받으세요.
          </p>
        </div>

        <!-- 로그인 오류 -->
        <div
          class="alert error"
          id="login-error"
          role="alert"
          hidden
        >
          이메일 또는 비밀번호가 올바르지 않아요.
        </div>

        <!-- 기존 Cognito 로그인 연결 -->
        <form
          id="loginForm"
          novalidate
          style="margin-top:16px"
        >

          <!-- 이메일 -->
          <div class="field" id="f-email">
            <label for="userId">이메일</label>

            <input
              class="input"
              id="userId"
              name="email"
              type="email"
              autocomplete="username"
              placeholder="you@example.com"
              required
            >

            <span class="error">
              올바른 이메일 주소를 입력해주세요.
            </span>
          </div>

          <!-- 비밀번호 -->
          <div class="field" id="f-password">
            <label for="password">비밀번호</label>

            <div class="input-wrap">
              <input
                class="input"
                id="password"
                name="password"
                type="password"
                autocomplete="current-password"
                placeholder="비밀번호"
                required
              >

              <button
                class="icon-btn"
                id="passwordToggle"
                type="button"
                aria-label="비밀번호 보기"
                aria-pressed="false"
              >
                <svg
                  viewBox="0 0 24 24"
                  width="20"
                  height="20"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.8"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  aria-hidden="true"
                >
                  <path
                    d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"
                  />
                  <circle cx="12" cy="12" r="3"/>
                </svg>
              </button>
            </div>

            <span class="error">
              비밀번호를 입력해주세요.
            </span>
          </div>

          <!-- 로그인 결과 메시지 -->
          <p
            id="loginMessage"
            role="status"
            aria-live="polite"
            style="font-size:13px;color:#ff9c90"
          ></p>

          <!-- 로그인 상태 유지 -->
          <div class="row" style="margin:14px 0 20px">
            <label class="checkbox">
              <input type="checkbox" id="remember" checked>
              로그인 상태 유지
            </label>

            <span class="spacer"></span>

            <a
              class="link"
              href="forgot-password.html"
              style="font-size:14px"
            >
              비밀번호를 잊으셨나요?
            </a>
          </div>

          <!-- 로그인 버튼 -->
          <button
            class="btn btn-primary btn-block btn-lg"
            id="loginButton"
            type="submit"
          >
            로그인
          </button>

        </form>

        <!-- 회원가입 -->
        <div class="auth-foot">
          아직 계정이 없나요?
          <a class="link" href="signup.html">
            회원가입
          </a>
        </div>

      </div>
    </div>
  </main>

  <!-- 비밀번호 표시 -->
  <script>
    document
      .getElementById("passwordToggle")
      .addEventListener("click", function () {
        const input = document.getElementById("password");
        const show = input.type === "password";

        input.type = show ? "text" : "password";

        this.setAttribute("aria-pressed", String(show));

        this.setAttribute(
          "aria-label",
          show ? "비밀번호 숨기기" : "비밀번호 보기"
        );
      });
  </script>

  <!-- 기존 AWS Cognito 로그인 기능 -->
  <script
    type="module"
    src="../js/login.js"
  ></script>

</body>
</html>
