
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#141414">

    <title>RecoMate | 로그인</title>

    <link rel="stylesheet" href="../css/common.css">
    <link rel="stylesheet" href="../css/background.css">
    <link rel="stylesheet" href="../css/auth.css">

    <style>
        /* 원본 시안 로그인 화면 구조 */

        .stage {
            position: relative;
            z-index: 1;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 56px 20px;
        }

        .view {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            animation: fade .45s ease both;
        }

        @keyframes fade {
            from {
                opacity: 0;
                transform: translateY(8px);
            }
            to {
                opacity: 1;
                transform: none;
            }
        }

        .back {
            position: fixed;
            top: 22px;
            left: 26px;
            z-index: 5;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: #141414;
            color: #e8e8e8;
            border: 1px solid #2c2c2c;
            border-radius: 999px;
            padding: 7px 14px 7px 10px;
            font: 400 13px 'Inter', 'Noto Sans KR', sans-serif;
            text-decoration: none;
            cursor: pointer;
            transition: border-color .15s;
        }

        .back:hover {
            border-color: #777;
        }

        .auth {
            width: min(400px, 100%);
            background: var(--panel);
            border: 1px solid #262626;
            border-radius: 10px;
            padding: 34px clamp(22px, 9%, 38px) 28px;
            box-shadow: 0 14px 50px rgba(0, 0, 0, .35);
            text-align: left;
            animation: cardUp .55s cubic-bezier(.2, .7, .2, 1) both;
        }

        @keyframes cardUp {
            from {
                opacity: 0;
                transform: translateY(18px);
            }
            to {
                opacity: 1;
                transform: none;
            }
        }

        .brand {
            margin: 0 0 8px;
            text-align: center;
            font-size: 34px;
            font-weight: 400;
            letter-spacing: .5px;
            line-height: 1.2;
        }

        .brand a {
            background: var(--brand);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-decoration: none;
        }

        .tagline {
            margin: 0 0 24px;
            text-align: center;
            font-size: 13.5px;
            color: #a3a3a3;
        }

        .fg {
            margin: 0 0 14px;
        }

        .fg label {
            display: block;
            margin: 0 0 6px 2px;
            font-size: 12px;
            color: #bdbdbd;
        }

        .pw {
            position: relative;
        }

        .field {
            display: block;
            width: 100%;
            height: 42px;
            padding: 0 13px;
            color: #ececec;
            outline: 0;
            background: #000;
            border: 1px solid #2c2c2c;
            border-radius: var(--r);
            font: 400 14px 'Inter', 'Noto Sans KR', sans-serif;
            text-align: left;
            transition: border-color .15s;
        }

        .pw .field {
            padding-right: 42px;
        }

        .field::placeholder {
            color: #7d7d7d;
        }

        .field:hover {
            border-color: #444;
        }

        .field:focus {
            border-color: transparent;
            background:
                linear-gradient(#000, #000) padding-box,
                var(--brand) border-box;
        }

        .eye {
            position: absolute;
            right: 8px;
            top: 50%;
            transform: translateY(-50%);
            width: 30px;
            height: 30px;
            display: grid;
            place-items: center;
            background: none;
            border: 0;
            border-radius: 6px;
            color: #8d8d8d;
            cursor: pointer;
        }

        .eye:hover {
            color: #fff;
        }

        .eye svg {
            width: 18px;
            height: 18px;
            fill: none;
            stroke: currentColor;
            stroke-width: 1.8;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .btn {
            display: block;
            width: 100%;
            height: 42px;
            margin-top: 4px;
            border: 0;
            border-radius: var(--r);
            cursor: pointer;
            background: var(--brand);
            color: #fff;
            font: 600 15px 'Inter', 'Noto Sans KR', sans-serif;
            transition: filter .15s, transform .1s;
        }

        .btn:hover:not(:disabled) {
            filter: brightness(1.12);
        }

        .btn:disabled {
            background: #2a2a2a;
            color: #8a8a8a;
            cursor: not-allowed;
        }

        .alt {
            display: flex;
            justify-content: flex-end;
            margin-top: 14px;
        }

        .text-link {
            background: none;
            border: 0;
            padding: 4px 0;
            cursor: pointer;
            color: #a8a8a8;
            font-size: 13px;
            text-decoration: underline;
            text-underline-offset: 4px;
        }

        .text-link:hover {
            color: #fff;
        }

        .err {
            min-height: 20px;
            margin: 0 0 4px;
            font-size: 13px;
            color: #ff9c90;
            text-align: center;
        }

        .err.ok {
            color: #8fe0a8;
        }

        @media (max-width: 560px) {
            .stage {
                justify-content: flex-start;
                padding: 70px 16px 24px;
            }

            .auth {
                padding: 34px 22px 26px;
            }

            .brand {
                font-size: 30px;
            }

            .back {
                position: static;
                margin: 0 0 12px;
                align-self: flex-start;
            }
        }
    </style>
</head>

<body class="login-page" data-mode="auth">

    <!-- 원본 시안 배경 -->
    <div class="fx" aria-hidden="true">
        <div class="fxin">
            <i></i>
        </div>
    </div>
    <div class="fxn" aria-hidden="true"></div>

    <main>
        <section class="stage">
            <div class="view">

                <!-- 홈으로 돌아가기 -->
                <a href="index.html" class="back">
                    ← 홈
                </a>

                <!-- 로그인 카드 -->
                <form class="auth" id="loginForm" novalidate>

                    <h1 class="brand">
                        <a href="index.html">RecoMate</a>
                    </h1>

                    <p class="tagline">
                        함께 볼 콘텐츠, 고민 없이
                    </p>

                    <!-- 이메일 -->
                    <div class="fg">
                        <label for="userId">이메일</label>

                        <input
                            class="field"
                            id="userId"
                            name="email"
                            type="email"
                            placeholder="email"
                            autocomplete="username"
                            required
                        >
                    </div>

                    <!-- 비밀번호 -->
                    <div class="fg">
                        <label for="password">비밀번호</label>

                        <div class="pw">
                            <input
                                class="field"
                                id="password"
                                name="password"
                                type="password"
                                placeholder="password"
                                autocomplete="current-password"
                                required
                            >

                            <button
                                class="eye"
                                id="passwordToggle"
                                type="button"
                                aria-pressed="false"
                                aria-label="비밀번호 보기"
                            >
                                <svg viewBox="0 0 24 24" aria-hidden="true">
                                    <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"></path>
                                    <circle cx="12" cy="12" r="3"></circle>
                                </svg>
                            </button>
                        </div>
                    </div>

                    <!-- 로그인 결과 -->
                    <p
                        class="err"
                        id="loginMessage"
                        role="status"
                        aria-live="polite"
                    ></p>

                    <!-- 로그인 버튼 -->
                    <button
                        class="btn"
                        id="loginButton"
                        type="submit"
                    >
                        login
                    </button>

                    <!-- 회원가입 -->
                    <div class="alt">
                        <a href="signup.html" class="text-link">
                            회원가입 하기
                        </a>
                    </div>

                </form>
            </div>
        </section>
    </main>

    <!-- 비밀번호 표시 -->
    <script>
        const passwordInput = document.getElementById("password");
        const passwordToggle = document.getElementById("passwordToggle");

        passwordToggle.addEventListener("click", () => {
            const show = passwordInput.type === "password";

            passwordInput.type = show ? "text" : "password";

            passwordToggle.setAttribute("aria-pressed", String(show));
            passwordToggle.setAttribute(
                "aria-label",
                show ? "비밀번호 숨기기" : "비밀번호 보기"
            );
        });
    </script>

    <!-- 기존 AWS Cognito 로그인 유지 -->
    <script type="module" src="../js/login.js"></script>

</body>
</html>
