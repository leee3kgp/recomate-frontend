
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >
    <meta name="theme-color" content="#141414">

    <title>RecoMate | 추천 결과</title>

    <!-- 공통 글꼴 -->
    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >
    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >
    <link
        href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <!-- 공통 디자인 시스템 -->
    <link rel="stylesheet" href="../css/common.css">
    <link rel="stylesheet" href="../css/navbar.css">
    <link rel="stylesheet" href="../css/footer.css">
    <link rel="stylesheet" href="../css/toast.css">

    <!-- 추천 결과 화면 (최종 디자인 시안): .result-page 범위 -->
    <link rel="stylesheet" href="../css/result-page.css">

    <!-- Chart.js -->
    <script
        src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"
    ></script>
</head>

<body>

    <!-- 공통 네비게이션 -->
    <div id="navbar-container"></div>

    <!--
        추천 결과 (1위 / 2·3위 / 취향 분석 차트)
        js/result.js 가 이 영역에 렌더링
    -->
    <main id="app" class="result-page page"></main>

    <!-- 공통 푸터 -->
    <footer id="site-footer"></footer>

    <!-- 공통 네비게이션 / 인증 / 푸터 -->
    <script type="module">
        import "../js/navbar.js";
        import "../js/auth-ui.js";
        import "../js/footer.js";
    </script>

    <!-- 추천 결과 API 및 차트 -->
    <script
        type="module"
        src="../js/result.js"
    ></script>

</body>
</html>
