
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#08080d">

    <title>RecoMate 추천 결과</title>

    <!-- 공통 CSS -->
    <link rel="stylesheet" href="../css/common.css">
    <link rel="stylesheet" href="../css/navbar.css">
    <link rel="stylesheet" href="../css/background.css">

    <!-- 추천 결과 전용 CSS -->
    <link rel="stylesheet" href="../css/result.css">

    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
</head>

<body>

    <!-- 공통 네비게이션 삽입 위치 -->
    <div id="navbar-container"></div>

    <!-- 추천 결과 메인 -->
    <main class="result-container">

        <!-- 결과 헤더 -->
        <section class="result-header">

            <h2>그룹 맞춤 추천 결과</h2>

            <p class="result-subtitle">
                모든 참여자의 취향을 종합 분석하여 선정된 TOP 3 콘텐츠입니다.
            </p>

        </section>

        <!-- TOP 3 추천 카드 -->
        <section class="recommendations-section">

            <div
                id="recommendations-container"
                class="recommendations-grid"
            >
                <!-- JS에서 추천 결과 생성 -->
            </div>

        </section>

        <!-- 그룹 취향 분석 -->
        <section class="analysis-section" hidden>

            <h3 class="analysis-title">
                그룹 취향 분석 리포트
            </h3>

            <div class="charts-container">

                <div class="chart-box">

                    <h4>장르 선호도 분포</h4>

                    <canvas id="genreChart"></canvas>

                </div>

                <div class="chart-box">

                    <h4>참여자별 취향 일치율</h4>

                    <canvas id="matchChart"></canvas>

                </div>

            </div>

        </section>

        <!-- 하단 버튼 -->
        <div class="result-actions">

            <a
                href="index.html"
                class="secondary-btn"
            >
                홈으로 가기
            </a>

            <a
                href="index.html#count"
                class="primary-btn"
            >
                다시 추천받기
            </a>

        </div>

    </main>

    <!-- 공통 네비게이션 생성 후 인증 상태 확인 -->
    <script type="module">
        import "../js/navbar.js";
        import "../js/auth-ui.js";
    </script>

    <!-- 기존 추천 결과 및 차트 기능 -->
    <script type="module" src="../js/result.js"></script>

</body>
</html>
