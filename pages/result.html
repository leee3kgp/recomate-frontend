<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RecoMate 추천 결과</title>
    <link rel="stylesheet" href="../css/index.css">
    <link rel="stylesheet" href="../css/result.css">

    <!-- Chart.js CDN 추가 -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
</head>
<body>
    <nav class="nav-bar">
        <h1 class="logo">RecoMate</h1>
        <a class="nav-btn" href="index.html">홈</a>
        <a class="nav-btn">요즘 대세 콘텐츠</a>
        <a class="nav-btn" style="margin-left: auto;">검색</a>
        <a class="nav-btn" href="profile.html">프로필</a>
        <a class="nav-btn" id="authButton" href="login.html">로그인</a>
    </nav>

    <!-- result 컨테이너 -->
    <main class="result-container">
        <!-- 헤더 영역 -->
        <section class="result-header">
            <h2>그룹 맞춤 추천 결과</h2>
            <p class="result-subtitle">모든 참여자의 취향을 종합 분석하여 선정된 TOP 3 콘텐츠입니다.</p>
        </section>

        <!-- TOP 3 카드 리스트 영역 -->
        <section class="recommendations-section">
            <div id="recommendations-container" class="recommendations-grid">
                <!-- JS가 더미/API 데이터를 동적으로 렌더링 -->
            </div>
        </section>

        <!-- 취향 분석 차트 영역 추가 -->
        <section class="analysis-section">
            <h3 class="analysis-title">그룹 취향 분석 리포트</h3>
            <div class="charts-container">
                <div class="chart-box">
                    <h4>장르 선호도 분포</h4>
                    <canvas id="genreChart"></canvas>
                </div>
                <div class="chart-box">
                    <h4>참여자별 취향 일치율</h4>
                    <canvas id="matchChart"></canvas>
                </div>
            </div>
        </section>

        <!-- 홈 / 다시 선택 버튼 -->
        <div class="result-actions">
            <a href="index.html" class="secondary-btn">홈으로 가기</a>
            <a href="select.html" class="primary-btn">다시 추천받기</a>
        </div>
    </main>

    <!-- 로그인 상태 관리 -->
    <script type="module" src="../js/auth-ui.js"></script>

    <!-- 결과 화면 조작 JS -->
    <script type="module" src="../js/result.js"></script>
</body>
</html>
