<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#141414">

    <title>RecoMate | 추천 결과</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">

    <!-- 공통 CSS -->
    <link rel="stylesheet" href="../css/common.css">
    <link rel="stylesheet" href="../css/navbar.css">
    <link rel="stylesheet" href="../css/background.css">

    <!-- 시안 공통 레이아웃(.stage / .panel / .link-btn) + 추천 결과 전용 CSS -->
    <link rel="stylesheet" href="../css/flow.css">
    <link rel="stylesheet" href="../css/result.css">

    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
</head>

<body class="flow-page" data-mode="flow">

    <!-- 공통 네비게이션 -->
    <div id="navbar-container"></div>

    <!-- 원본 시안 배경 레이어 -->
    <div class="fx" aria-hidden="true">
        <div class="fxin">
            <i></i>
        </div>
    </div>
    <div class="fxn" aria-hidden="true"></div>

    <!-- TOP 3 결과(기본) / 취향 분석 리포트(#report) 화면은 js/result.js 가 이 안에 그림 -->
    <main id="app"></main>

    <!-- 공통 네비게이션 생성 후 인증 상태 확인 -->
    <script type="module">
        import "../js/navbar.js";
        import "../js/auth-ui.js";
    </script>

    <script type="module" src="../js/result.js"></script>

</body>
</html>
