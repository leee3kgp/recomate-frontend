
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="요청한 페이지를 찾을 수 없어요.">
    <meta name="theme-color" content="#141414">
    <meta name="robots" content="noindex">

    <title>페이지를 찾을 수 없어요 | RecoMate</title>

    <!-- 없는 주소(/foo, /a/b 등)에서도 이 페이지가 열리므로 상대 링크의 기준을 /pages/로 고정 -->
    <base href="/pages/">

    <link rel="stylesheet" href="../css/common.css">
    <link rel="stylesheet" href="../css/navbar.css">

    <style>
        body.error-page {
            min-height: 100vh;
            margin: 0;
            background: #141414;
            color: #f2f2f2;
            font-family: var(--font-main, sans-serif);
        }

        .error-main {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: calc(100vh - var(--nav-h, 58px));
            padding: 48px 24px;
        }

        .error-content {
            width: 100%;
            max-width: 460px;
        }

        .error-code {
            color: #e57a14;
            font-size: 15px;
            font-weight: 700;
        }

        .error-content h1 {
            margin: 14px 0 8px;
            font-size: 24px;
            font-weight: 700;
            line-height: 1.4;
        }

        .error-description {
            margin: 0 0 24px;
            color: #aaa;
            font-size: 15px;
            line-height: 1.8;
        }

        .error-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
        }

        .error-actions .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 42px;
            padding: 10px 18px;
            border: 1px solid transparent;
            border-radius: 8px;
            font: inherit;
            font-size: 14px;
            font-weight: 600;
            text-decoration: none;
            cursor: pointer;
            transition: filter 0.15s ease;
        }

        .error-actions .btn:hover {
            filter: brightness(1.12);
        }

        .error-actions .btn-primary {
            background: linear-gradient(
                90deg,
                #7b3593,
                #c96a0b
            );
            color: #fff;
        }

        .error-actions .btn-secondary {
            background: #292929;
            border-color: #444;
            color: #f2f2f2;
        }

        .error-actions .btn-ghost {
            background: transparent;
            color: #ddd;
        }

        @media (max-width: 480px) {
            .error-main {
                padding: 36px 20px;
            }

            .error-content h1 {
                font-size: 22px;
            }

            .error-actions {
                gap: 8px;
            }
        }
    </style>
</head>

<body class="error-page" data-page="404">

    <a class="sr-only" href="#main">
        본문 바로가기
    </a>

    <!-- 기존 공통 네비게이션 -->
    <div id="navbar-container"></div>

    <main id="main" class="error-main" tabindex="-1">

        <div class="error-content">

            <div class="error-code">
                404
            </div>

            <h1>찾는 페이지가 없어요</h1>

            <p class="error-description">
                주소가 바뀌었거나 삭제된 페이지예요.
                공유받은 추천 결과라면 만든 사람이 기록을
                지웠을 수 있어요.
            </p>

            <div class="error-actions">

                <a
                    class="btn btn-primary"
                    href="index.html"
                >
                    홈으로
                </a>

                <a
                    class="btn btn-secondary"
                    href="index.html#app"
                >
                    추천받기
                </a>

                <a
                    class="btn btn-ghost"
                    href="index.html"
                >
                    작품 검색
                </a>

            </div>

        </div>

    </main>

    <script type="module">
        import "../js/navbar.js";
        import "../js/auth-ui.js";

        // base 때문에 "#main"은 /pages/#main으로 이동하므로, 같은 화면 안에서 본문으로 포커스만 옮긴다
        document.querySelector('a[href="#main"]').addEventListener("click", (event) => {
            event.preventDefault();
            document.getElementById("main").focus();
        });
    </script>

</body>
</html>
