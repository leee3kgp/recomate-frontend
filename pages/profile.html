
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#141414">

    <title>내 프로필 - RecoMate</title>

    <!-- 공통 스타일 -->
    <link rel="stylesheet" href="../css/common.css">
    <link rel="stylesheet" href="../css/navbar.css">
    <link rel="stylesheet" href="../css/background.css">

    <!-- 프로필 전용 스타일 -->
    <link rel="stylesheet" href="../css/profile.css">
</head>

<body class="profile-page" data-mode="profile">

    <!-- 공통 네비게이션 -->
    <div id="navbar-container"></div>

    <!-- 원본 시안 배경 -->
    <div class="fx" aria-hidden="true">
        <div class="fxin">
            <i></i>
        </div>
    </div>
    <div class="fxn" aria-hidden="true"></div>

    <!-- 원본 시안 프로필 구조 -->
    <main class="stage top">
        <div class="view">
            <div class="panel pfp">
                <div class="pf">

                    <!-- 페이지 제목 -->
                    <h3>내 프로필</h3>

                    <!-- 공통 상태 및 오류 메시지 -->
                    <p
                        id="profileMessage"
                        role="status"
                        aria-live="polite"
                    >
                        사용자 정보를 불러오는 중입니다.
                    </p>

                    <!-- 기본 정보 카드 -->
                    <section class="pf-card">
                        <h4>기본 정보</h4>

                        <!-- 이메일 -->
                        <div class="fg">
                            <label for="userEmail">
                                이메일
                            </label>

                            <div class="pw">
                                <input
                                    class="field"
                                    type="email"
                                    id="userEmail"
                                    readonly
                                    placeholder="이메일"
                                >

                                <svg
                                    class="lock"
                                    viewBox="0 0 24 24"
                                    fill="none"
                                    stroke="currentColor"
                                    stroke-width="1.8"
                                    stroke-linecap="round"
                                    stroke-linejoin="round"
                                    aria-hidden="true"
                                >
                                    <rect
                                        x="5"
                                        y="10"
                                        width="14"
                                        height="11"
                                        rx="2"
                                    ></rect>
                                    <path
                                        d="M8 10V7a4 4 0 0 1 8 0v3"
                                    ></path>
                                </svg>
                            </div>
                        </div>

                        <!-- 닉네임 수정 -->
                        <form id="nicknameForm">

                            <div class="fg">
                                <label for="userNickname">
                                    닉네임
                                </label>

                                <input
                                    class="field"
                                    type="text"
                                    id="userNickname"
                                    maxlength="40"
                                    placeholder="닉네임을 입력하세요"
                                    required
                                >
                            </div>

                            <!-- 저장 버튼 및 메시지 -->
                            <div class="pf-row">

                                <button
                                    class="btn"
                                    type="submit"
                                    id="saveNicknameBtn"
                                    disabled
                                >
                                    닉네임 저장
                                </button>

                                <span
                                    class="pf-msg"
                                    id="nick-msg"
                                    role="status"
                                    aria-live="polite"
                                ></span>

                            </div>
                        </form>
                    </section>

                    <!-- 선호 장르 카드 -->
                    <section class="pf-card">
                        <h4>내 선호 장르</h4>

                        <p class="desc">
                            좋아하는 장르를 선택하고 저장하세요.
                        </p>

                        <div
                            class="chips"
                            id="genreList"
                        >
                            장르 정보를 불러오는 중입니다.
                        </div>

                        <!-- 저장 버튼 및 메시지 -->
                        <div class="pf-row">

                            <button
                                class="btn"
                                type="button"
                                id="saveGenresBtn"
                                disabled
                            >
                                선호 장르 저장
                            </button>

                            <span
                                class="pf-msg"
                                id="genre-msg"
                                role="status"
                                aria-live="polite"
                            ></span>

                        </div>
                    </section>

                    <!-- 회원 탈퇴 영역 -->
                    <section class="pf-danger">

                        <div>
                            <h4>회원 탈퇴</h4>
                            <p>
                                회원 탈퇴 시 계정 및 관련 데이터가
                                삭제될 수 있습니다.
                            </p>
                        </div>

                        <button
                            class="btn-out"
                            type="button"
                            id="deleteAccountBtn"
                            disabled
                        >
                            회원 탈퇴
                        </button>

                    </section>

                </div>
            </div>
        </div>
    </main>

    <!-- 공통 네비게이션 및 인증 -->
    <script type="module">
        import "../js/navbar.js";
        import "../js/auth-ui.js";
    </script>

    <!-- 기존 프로필 API 및 저장 메시지 -->
    <script
        type="module"
        src="../js/profile.js"
    ></script>

</body>
</html>
