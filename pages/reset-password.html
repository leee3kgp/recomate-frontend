
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#141414">

    <title>비밀번호 재설정 | RecoMate</title>

    <link rel="stylesheet" href="../css/common.css">
    <link rel="stylesheet" href="../css/auth.css">

    <style>
        /* 초기 forgot-password.html 시안의 인증 화면 스타일 */

        body.reset-password-page {
            margin: 0;
            min-height: 100vh;
            background: #141414;
            color: #f2f2f2;
            font-family: var(--font-main, "IBM Plex Sans KR", sans-serif);
        }

        .reset-auth {
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 24px 16px;
            background: linear-gradient(
                100deg,
                #5c2f68 0%,
                #6e3a40 46%,
                #8a4d12 100%
            );
        }

        .reset-auth-card {
            width: min(100%, 400px);
        }

        .reset-card {
            width: 100%;
            padding: 32px 28px 28px;
            background: #141414;
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            box-shadow: 0 24px 56px rgba(0, 0, 0, 0.45);
        }

        .reset-card [hidden] {
            display: none !important;
        }

        .reset-auth-head {
            display: grid;
            justify-items: center;
            text-align: center;
            margin-bottom: 24px;
        }

        .reset-logo {
            display: inline-block;
            font-size: 30px;
            font-weight: 700;
            letter-spacing: -0.02em;
            line-height: 1.4;
            text-decoration: none;
            background: linear-gradient(90deg, #9b3fb5, #e57a14);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .reset-steps {
            display: flex;
            justify-content: center;
            gap: 7px;
            margin-top: 16px;
        }

        .reset-steps i {
            width: 26px;
            height: 4px;
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.2);
        }

        .reset-steps i.on {
            background: linear-gradient(90deg, #9b3fb5, #e57a14);
        }

        .reset-auth-head h1 {
            margin: 16px 0 6px;
            font-size: 18px;
            font-weight: 700;
        }

        .reset-muted {
            margin: 0;
            color: #8d8d8d;
            font-size: 14px;
            line-height: 1.6;
        }

        .reset-sent-to {
            color: #f2f2f2;
            font-weight: 600;
            overflow-wrap: anywhere;
        }

        .reset-field {
            display: grid;
            gap: 6px;
            margin-top: 16px;
        }

        .reset-field label {
            color: #c9c4c4;
            font-size: 14px;
            font-weight: 500;
        }

        .reset-input {
            width: 100%;
            height: 46px;
            padding: 0 14px;
            border: 1px solid transparent;
            border-radius: 8px;
            background: #0a0a0a;
            color: #f2f2f2;
            font: inherit;
            font-size: 14px;
            outline: none;
        }

        .reset-input:focus {
            border-color: #e57a14;
            box-shadow: 0 0 0 2px rgba(229, 122, 20, 0.12);
        }

        .reset-input::placeholder {
            color: #777;
        }

        .reset-otp {
            display: grid;
            grid-template-columns: repeat(6, minmax(0, 1fr));
            gap: 8px;
            margin-top: 4px;
        }

        .reset-otp input {
            width: 100%;
            min-width: 0;
            height: 48px;
            padding: 0;
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 8px;
            background: #0a0a0a;
            color: #f2f2f2;
            text-align: center;
            font: inherit;
            font-size: 20px;
            outline: none;
        }

        .reset-otp input:focus {
            border-color: #e57a14;
        }

        .reset-resend-row {
            margin: 10px 0 18px;
            text-align: center;
            color: #8d8d8d;
            font-size: 13px;
            line-height: 1.6;
        }

        .reset-link {
            padding: 0;
            border: 0;
            background: transparent;
            color: #c9c4c4;
            font: inherit;
            text-decoration: underline;
            text-underline-offset: 3px;
            cursor: pointer;
        }

        .reset-link:hover {
            color: #fff;
        }

        .reset-link:disabled {
            opacity: 0.45;
            cursor: not-allowed;
        }

        .reset-input-wrap {
            position: relative;
        }

        .reset-input-wrap .reset-input {
            padding-right: 52px;
        }

        .reset-eye {
            position: absolute;
            top: 50%;
            right: 6px;
            transform: translateY(-50%);
            width: 38px;
            height: 38px;
            display: grid;
            place-items: center;
            border: 0;
            border-radius: 8px;
            background: transparent;
            color: #aaa;
            cursor: pointer;
        }

        .reset-eye:hover {
            color: #fff;
        }

        .reset-eye svg {
            width: 20px;
            height: 20px;
            fill: none;
            stroke: currentColor;
            stroke-width: 1.8;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .reset-rules {
            display: flex;
            flex-wrap: wrap;
            gap: 6px 12px;
            margin-top: 4px;
        }

        .reset-rules span {
            color: #8d8d8d;
            font-size: 12px;
        }

        .reset-rules span::before {
            content: "○ ";
        }

        .reset-rules span.valid {
            color: #6cc08b;
        }

        .reset-rules span.valid::before {
            content: "✓ ";
        }

        .reset-confirm-error {
            display: none;
            color: #e86a5f;
            font-size: 12px;
        }

        .reset-field.invalid .reset-confirm-error {
            display: block;
        }

        .reset-field.invalid .reset-input {
            border-color: #e86a5f;
        }

        .reset-message {
            margin: 16px 0 0;
            font-size: 13px;
            line-height: 1.6;
            text-align: center;
            overflow-wrap: anywhere;
        }

        .reset-message:empty {
            display: none;
        }

        .reset-primary {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            min-height: 50px;
            margin-top: 20px;
            padding: 0 16px;
            border: 0;
            border-radius: 8px;
            background: linear-gradient(
                100deg,
                #793988 0%,
                #9e4d4b 52%,
                #c16311 100%
            );
            color: #fff;
            font: inherit;
            font-size: 15px;
            font-weight: 600;
            text-decoration: none;
            cursor: pointer;
        }

        .reset-primary:hover:not(:disabled) {
            filter: brightness(1.12);
        }

        .reset-primary:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .reset-auth-foot {
            margin-top: 24px;
            text-align: center;
        }

        .reset-done {
            text-align: center;
        }

        .reset-done h1 {
            margin: 18px 0 8px;
            font-size: 22px;
        }

        .reset-done .reset-primary {
            margin-top: 24px;
        }

        @media (max-width: 480px) {
            .reset-card {
                padding: 28px 20px 24px;
            }

            .reset-otp {
                gap: 5px;
            }

            .reset-otp input {
                height: 44px;
                font-size: 18px;
            }
        }
    </style>
</head>

<body class="reset-password-page">

    <main id="main" class="reset-auth">
        <div class="reset-auth-card">
            <div class="reset-card">

                <!-- 2단계: 인증번호 + 새 비밀번호 -->
                <section id="step-reset">

                    <div class="reset-auth-head">
                        <a class="reset-logo" href="index.html">
                            RecoMate
                        </a>

                        <div
                            class="reset-steps"
                            aria-label="3단계 중 2단계"
                        >
                            <i class="on"></i>
                            <i class="on"></i>
                            <i></i>
                        </div>

                        <h1>새 비밀번호 설정</h1>

                        <p class="reset-muted">
                            <strong
                                id="sent-to"
                                class="reset-sent-to"
                            ></strong>
                            (으)로 보낸 인증번호를 입력해주세요.
                        </p>
                    </div>

                    <form id="resetPasswordForm" novalidate>

                        <div
                            class="reset-otp"
                            id="otp"
                            role="group"
                            aria-label="이메일 인증번호 6자리"
                        >
                            <input
                                type="text"
                                inputmode="numeric"
                                autocomplete="one-time-code"
                                maxlength="6"
                                aria-label="인증번호 첫 번째 자리"
                            >
                            <input
                                type="text"
                                inputmode="numeric"
                                maxlength="1"
                                aria-label="인증번호 두 번째 자리"
                            >
                            <input
                                type="text"
                                inputmode="numeric"
                                maxlength="1"
                                aria-label="인증번호 세 번째 자리"
                            >
                            <input
                                type="text"
                                inputmode="numeric"
                                maxlength="1"
                                aria-label="인증번호 네 번째 자리"
                            >
                            <input
                                type="text"
                                inputmode="numeric"
                                maxlength="1"
                                aria-label="인증번호 다섯 번째 자리"
                            >
                            <input
                                type="text"
                                inputmode="numeric"
                                maxlength="1"
                                aria-label="인증번호 여섯 번째 자리"
                            >
                        </div>

                        <p class="reset-resend-row">
                            인증번호를 받지 못하셨나요? ·
                            <button
                                type="button"
                                id="resendResetCode"
                                class="reset-link"
                            >
                                다시 받기
                            </button>
                        </p>

                        <div class="reset-field">
                            <label for="newPassword">
                                새 비밀번호
                            </label>

                            <div class="reset-input-wrap">
                                <input
                                    class="reset-input"
                                    type="password"
                                    id="newPassword"
                                    placeholder="12자 이상"
                                    autocomplete="new-password"
                                    minlength="12"
                                    required
                                >

                                <button
                                    type="button"
                                    class="reset-eye"
                                    id="toggleNewPassword"
                                    aria-label="비밀번호 보기"
                                    aria-pressed="false"
                                >
                                    <svg
                                        viewBox="0 0 24 24"
                                        aria-hidden="true"
                                    >
                                        <path
                                            d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12z"
                                        ></path>
                                        <circle
                                            cx="12"
                                            cy="12"
                                            r="3"
                                        ></circle>
                                    </svg>
                                </button>
                            </div>

                            <div
                                class="reset-rules"
                                id="passwordRules"
                                aria-live="polite"
                            >
                                <span data-rule="length">12자 이상</span>
                                <span data-rule="lowercase">소문자</span>
                                <span data-rule="number">숫자</span>
                                <span data-rule="symbol">특수문자</span>
                            </div>
                        </div>

                        <div
                            class="reset-field"
                            id="confirmPasswordField"
                        >
                            <label for="confirmPassword">
                                새 비밀번호 확인
                            </label>

                            <input
                                class="reset-input"
                                type="password"
                                id="confirmPassword"
                                placeholder="한 번 더 입력"
                                autocomplete="new-password"
                                required
                            >

                            <span class="reset-confirm-error">
                                비밀번호가 일치하지 않아요.
                            </span>
                        </div>

                        <p
                            id="resetPasswordMessage"
                            class="reset-message"
                            role="status"
                            aria-live="polite"
                        ></p>

                        <button
                            type="submit"
                            id="resetPasswordButton"
                            class="reset-primary"
                            disabled
                        >
                            비밀번호 변경
                        </button>
                    </form>
                </section>

                <!-- 3단계: 비밀번호 변경 완료 -->
                <section
                    id="step-done"
                    class="reset-done"
                    hidden
                >
                    <a class="reset-logo" href="index.html">
                        RecoMate
                    </a>

                    <div
                        class="reset-steps"
                        aria-label="3단계 중 3단계"
                    >
                        <i class="on"></i>
                        <i class="on"></i>
                        <i class="on"></i>
                    </div>

                    <h1>비밀번호를 바꿨어요</h1>

                    <p class="reset-muted">
                        비밀번호 변경이 완료되었습니다.<br>
                        새 비밀번호로 다시 로그인해주세요.
                    </p>

                    <a
                        class="reset-primary"
                        href="login.html"
                    >
                        로그인하러 가기
                    </a>
                </section>

                <div
                    class="reset-auth-foot"
                    id="resetAuthFoot"
                >
                    <a class="reset-link" href="login.html">
                        로그인으로 돌아가기
                    </a>
                </div>

            </div>
        </div>
    </main>

    <script
        type="module"
        src="../js/reset-password.js"
    ></script>

</body>
</html>
