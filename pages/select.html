
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#08080d">

    <title>RecoMate 취향 선택</title>

    <!-- 공통 CSS -->
    <link rel="stylesheet" href="../css/common.css">
    <link rel="stylesheet" href="../css/navbar.css">
    <link rel="stylesheet" href="../css/background.css">

    <!-- 장르 선택 전용 CSS -->
    <link rel="stylesheet" href="../css/select.css">
</head>

<body>

    <!-- 공통 네비게이션 삽입 위치 -->
    <div id="navbar-container"></div>

    <!-- 장르 선택 메인 컨테이너 -->
    <main class="select-container">

        <h2>선호하는 장르를 선택해주세요</h2>

        <!-- 참여 인원 수 -->
        <div class="participant-count-wrapper">

            <span>참여 인원 수:</span>

            <span
                id="participantCountText"
                class="participant-count-text"
            ></span>

        </div>

        <!-- 장르 선택 폼 -->
        <form id="preference-form">

            <div id="participants-container"></div>

            <div id="error-message"></div>

            <button type="submit" id="submit-btn">
                추천받기
            </button>

        </form>

    </main>

    <!-- 공통 네비게이션 생성 후 인증 상태 확인 -->
    <script type="module">
        import "../js/navbar.js";
        await import("../js/auth-ui.js");
    </script>

    <!-- 기존 장르 선택 및 API 기능 -->
    <script type="module" src="../js/select.js"></script>

</body>
</html>
