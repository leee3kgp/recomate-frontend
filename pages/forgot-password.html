
<!doctype html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="가입한 이메일로 인증번호를 받아 비밀번호를 다시 설정하세요.">
    <meta name="theme-color" content="#141414">

    <title>비밀번호 재설정 | RecoMate</title>

    <link rel="stylesheet" href="../css/common.css">

    <style>
        body.forgot-page {
            min-height: 100vh;
            margin: 0;
            background: #141414;
            color: #f2f2f2;
            font-family: var(--font-main, "IBM Plex Sans KR", sans-serif);
        }

        .sr-only {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            border: 0;
        }

        .auth {
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 24px 16px;
            background: linear-gradient(
                100deg,
                #5c2f68 0%,
                #6e3a40 46%,
                #8a4d12 100%
            );
        }

        .auth-card {
            width: min(100%, 400px);
        }

        .auth-card > .card {
            padding: 32px 28px 28px;
            background: #141414;
            border: 1px solid #333;
            border-radius: 12px;
            box-shadow: 0 24px 56px rgba(0, 0, 0, 0.45);
        }

        .auth-head {
            display: grid;
            justify-items: center;
            text-align: center;
            margin-bottom: 24px;
        }

        .auth-head .logo {
            font-size: 30px;
            font-weight: 700;
            text-decoration: none;
        }

        .auth-head .logo span {
            background: linear-gradient(90deg, #9b3fb5, #e57a14);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .steps-dots {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 6px;
            margin-top: 16px;
        }

        .steps-dots i {
            width: 24px;
            height: 3px;
            border-radius: 2px;
            background: #444;
        }

        .steps-dots i.on {
            background: linear-gradient(90deg, #9b3fb5, #e57a14);
        }

        .auth-head h1 {
            margin: 16px 0 6px;
            font-size: 18px;
            font-weight: 700;
        }

        .muted {
            color: #aaa;
            line-height: 1.6;
        }

        .field {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .field label {
            font-size: 14px;
            color: #ddd;
        }

        .field .input {
            width: 100%;
            min-height: 46px;
            padding: 0 14px;
            background: #0a0a0a;
            border: 1px solid transparent;
            border-radius: 8px;
            color: #fff;
            font: inherit;
            font-size: 14px;
        }

        .field .input:focus {
            outline: none;
            border-color: #9b3fb5;
        }

        .field .error {
            display: none;
            font-size: 12px;
            color: #ff7777;
        }

        .field.invalid .error {
            display: block;
        }

        .field.invalid .input {
            border-color: #ff7777;
        }

        .btn {
            display: inline-flex;
            justify-content: center;
            align-items: center;
            border: 0;
            border-radius: 8px;
            font: inherit;
            font-weight: 700;
            cursor: pointer;
        }

        .btn-primary {
            background: linear-gradient(90deg, #7b3593, #c96a0b);
            color: #fff;
        }

        .btn-block {
            width: 100%;
        }

        .btn-lg {
            min-height: 46px;
            padding: 12px 20px;
            font-size: 15px;
        }

        .btn:disabled {
            opacity: 0.55;
            cursor: not-allowed;
        }

        .auth-foot {
            text-align: center;
            margin-top: 18px;
            font-size: 14px;
        }

        .auth-foot .link {
            color: #ddd;
            text-decoration: underline;
            text-underline-offset: 4px;
        }

        .auth-foot .link:hover {
            color: #fff;
        }

        #forgotPasswordMessage {
            margin: 12px 0 0;
            font-size: 13px;
            line-height: 1.5;
        }

        #forgotPasswordMessage:empty {
            display: none;
        }

        @media (max-width: 400px) {
            .auth-card > .card {
                padding: 22px 18px;
            }
        }
    </style>
</head>

<body class="forgot-page" data-page="forgot">

    <a class="sr-only" href="#main">본문 바로가기</a>

    <main id="main" class="auth">
        <div class="auth-card">
            <div class="card">

                <section id="step-email">

                    <div class="auth-head">

                        <a class="logo" href="index.html">
                            <span>RecoMate</span>
                        </a>

                        <div class="steps-dots" aria-label="3단계 중 1단계">
                            <i class="on"></i>
                            <i></i>
                            <i></i>
                        </div>

                        <h1>비밀번호를 잊으셨나요?</h1>

                        <p class="muted" style="margin:0">
                            가입한 이메일로 재설정 인증번호를 보내드려요.
                        </p>

                    </div>

                    <form id="email-form" novalidate>

                        <div class="field" id="f-email">

                            <label for="email">가입한 이메일</label>

                            <input
                                class="input"
                                id="email"
                                type="email"
                                autocomplete="email"
                                placeholder="you@example.com"
                                required
                            >

                            <span class="error">
                                올바른 이메일 주소를 입력해주세요.
                            </span>

                        </div>

                        <p
                            id="forgotPasswordMessage"
                            role="status"
                            aria-live="polite"
                        ></p>

                        <button
                            class="btn btn-primary btn-block btn-lg"
                            id="send-btn"
                            type="submit"
                            style="margin-top:20px"
                        >
                            인증번호 받기
                        </button>

                    </form>

                    <p
                        class="muted"
                        style="font-size:12px;margin:14px 0 0"
                    >
                        가입하지 않은 이메일이어도 같은 안내가 표시돼요.
                        계정이 있는지 다른 사람이 알 수 없게 하기 위해서예요.
                    </p>

                </section>

                <div class="auth-foot">
                    <a class="link" href="login.html">
                        로그인으로 돌아가기
                    </a>
                </div>

            </div>
        </div>
    </main>

    <script
        type="module"
        src="../js/forgot-password.js"
    ></script>

</body>
</html>
