
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >
    <meta name="theme-color" content="#141414">

    <title>RecoMate | 이메일 인증</title>

    <!-- 공통 글꼴 -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >
    <link
        href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <!-- 공통 디자인 시스템 -->
    <link rel="stylesheet" href="../css/common.css">
    <link rel="stylesheet" href="../css/toast.css">

    <!-- 기존 인증 화면 디자인 -->
    <link rel="stylesheet" href="../css/background.css">
    <link rel="stylesheet" href="../css/auth.css">

    <style>
        /* =========================================
           RecoMate 이메일 인증
           Issue #45
        ========================================= */

        .stage {
            position: relative;
            z-index: 1;

            min-height: 100vh;

            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;

            padding: 40px 20px;
        }

        .view {
            display: flex;
            flex-direction: column;
            align-items: center;

            width: 100%;

            animation: fade 0.45s ease both;
        }

        @keyframes fade {
            from {
                opacity: 0;
                transform: translateY(8px);
            }

            to {
                opacity: 1;
                transform: none;
            }
        }

        /* ---------- 홈 버튼 ---------- */

        .back {
            position: fixed;
            top: 22px;
            left: 26px;
            z-index: 5;

            display: inline-flex;
            align-items: center;
            gap: 6px;

            padding: 7px 14px 7px 10px;

            background: #141414;
            color: #e8e8e8;

            border: 1px solid #2c2c2c;
            border-radius: 999px;

            font-family: var(--font-main);
            font-size: 13px;
            text-decoration: none;

            transition: border-color 150ms ease;
        }

        .back:hover {
            border-color: #777;
        }

        /* ---------- 인증 카드 ---------- */

        .auth {
            width: min(400px, 100%);

            padding: 34px clamp(22px, 9%, 38px) 30px;

            background: var(--panel);
            border: 1px solid #262626;
            border-radius: 10px;

            box-shadow: 0 14px 50px rgba(0, 0, 0, 0.35);

            animation: cardUp 0.55s
                cubic-bezier(0.2, 0.7, 0.2, 1) both;
        }

        @keyframes cardUp {
            from {
                opacity: 0;
                transform: translateY(18px);
            }

            to {
                opacity: 1;
                transform: none;
            }
        }

        /* ---------- 로고 ---------- */

        .brand {
            margin: 0;

            text-align: center;
            font-size: 34px;
            font-weight: 400;
            letter-spacing: 0.5px;
            line-height: 1.2;
        }

        .brand a {
            background: var(--brand);

            -webkit-background-clip: text;
            background-clip: text;

            color: transparent;
            text-decoration: none;
        }

        /* ---------- 진행 단계 ---------- */

        .steps {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 9px;

            margin: 10px 0 26px;
        }

        .step-line {
            width: 27px;
            height: 4px;

            border-radius: 999px;
            background: #343434;
        }

        .step-line.active {
            background: var(--brand);
        }

        .step-label {
            margin-left: 5px;

            color: #999;
            font-size: 12px;
        }

        /* ---------- 인증 제목 ---------- */

        .verify-title {
            margin: 0 0 9px;

            color: #fff;

            font-size: 20px;
            font-weight: 700;
            text-align: center;
        }

        /* ---------- 이메일 안내 ---------- */

        .verify-info {
            margin: 0 0 26px;

            color: #aaa;

            font-size: 13px;
            line-height: 1.6;
            text-align: center;
        }

        .verify-email-text {
            color: #eee;
            font-weight: 600;
            overflow-wrap: anywhere;
        }

        /* ---------- 6자리 인증번호 ---------- */

        .code-group {
            display: flex;
            justify-content: space-between;
            gap: 8px;

            margin: 0 0 24px;
        }

        .code-box {
            width: 100%;
            min-width: 0;
            height: 52px;

            padding: 0;

            border: 1px solid #303030;
            border-radius: 8px;
            outline: none;

            background: #000;
            color: #fff;

            font-family: var(--font-main);
            font-size: 22px;
            font-weight: 600;
            text-align: center;
        }

        .code-box:focus {
            border-color: #bc5ca6;
            box-shadow:
                0 0 0 2px rgba(188, 92, 166, 0.15);
        }

        /* ---------- Cognito 연동 입력 ---------- */

        #verificationCode {
            position: absolute;

            width: 1px;
            height: 1px;
            padding: 0;

            border: 0;
            opacity: 0;
            pointer-events: none;
        }

        /* ---------- 인증 결과 ---------- */

        .verify-message {
            min-height: 18px;
            margin: 0 0 8px;

            color: #aaa;

            font-size: 12px;
            text-align: center;
        }

        .verify-message.success {
            color: #65d38c;
        }

        .verify-message.error {
            color: #ff7777;
        }

        /* ---------- 인증 완료 버튼 ---------- */

        .auth .btn {
            display: flex;
            align-items: center;
            justify-content: center;

            width: 100%;
            height: 42px;

            margin: 0;
            padding: 0 16px;

            border: 0;
            border-radius: var(--r);

            background: var(--brand);
            color: #fff;

            font-family: var(--font-main);
            font-size: 15px;
            font-weight: 600;

            cursor: pointer;
            transition: filter 150ms ease;
        }

        .auth .btn:hover:not(:disabled) {
            filter: brightness(1.12);
        }

        .auth .btn:disabled {
            background: #2a2a2a;
            color: #8a8a8a;
            cursor: not-allowed;
        }

        /* ---------- 인증번호 재발송 ---------- */

        .resend-button {
            display: block;

            margin: 18px auto 0;
            padding: 4px 8px;

            border: 0;
            background: transparent;

            color: #999;

            font-family: var(--font-main);
            font-size: 13px;
            text-align: center;

            cursor: pointer;
        }

        .resend-button:hover:not(:disabled) {
            color: #fff;
        }

        .resend-button:disabled {
            color: #888;
            cursor: default;
        }

        /* ---------- 모바일 ---------- */

        @media (max-width: 560px) {
            .stage {
                justify-content: flex-start;
                padding: 70px 16px 24px;
            }

            .auth {
                padding: 30px 22px;
            }

            .brand {
                font-size: 30px;
            }

            .back {
                position: static;
                align-self: flex-start;
                margin-bottom: 12px;
            }

            .code-group {
                gap: 6px;
            }

            .code-box {
                height: 48px;
                font-size: 20px;
            }
        }

        /* ---------- 모션 접근성 ---------- */

        @media (prefers-reduced-motion: reduce) {
            .view,
            .auth {
                animation: none;
            }
        }
    </style>
</head>

<body class="verify-page" data-mode="auth">

    <!-- 기존 그라데이션 배경 -->
    <div class="fx" aria-hidden="true">
        <div class="fxin">
            <i></i>
        </div>
    </div>

    <div class="fxn" aria-hidden="true"></div>

    <main>
        <section class="stage">
            <div class="view">

                <!-- 홈으로 돌아가기 -->
                <a href="index.html" class="back">
                    ← 홈
                </a>

                <!-- 이메일 인증 카드 -->
                <section class="auth">

                    <h1 class="brand">
                        <a href="index.html">
                            RecoMate
                        </a>
                    </h1>

                    <!-- 회원가입 2단계 -->
                    <div
                        class="steps"
                        aria-label="회원가입 2단계 / 2단계"
                    >
                        <span class="step-line active"></span>
                        <span class="step-line active"></span>
                        <span class="step-label">2 / 2</span>
                    </div>

                    <h2 class="verify-title">
                        이메일 인증
                    </h2>

                    <p class="verify-info">
                        <span
                            id="verificationEmail"
                            class="verify-email-text"
                        ></span>로 발송된
                        인증번호를 입력하세요
                    </p>

                    <!-- 인증 폼 -->
                    <form id="verifyForm">

                        <!-- 6자리 인증번호 입력 -->
                        <div
                            class="code-group"
                            id="verifyCodeGroup"
                        >
                            <input
                                class="code-box verify-code-box"
                                type="text"
                                inputmode="numeric"
                                maxlength="1"
                                aria-label="인증번호 첫 번째 자리"
                            >

                            <input
                                class="code-box verify-code-box"
                                type="text"
                                inputmode="numeric"
                                maxlength="1"
                                aria-label="인증번호 두 번째 자리"
                            >

                            <input
                                class="code-box verify-code-box"
                                type="text"
                                inputmode="numeric"
                                maxlength="1"
                                aria-label="인증번호 세 번째 자리"
                            >

                            <input
                                class="code-box verify-code-box"
                                type="text"
                                inputmode="numeric"
                                maxlength="1"
                                aria-label="인증번호 네 번째 자리"
                            >

                            <input
                                class="code-box verify-code-box"
                                type="text"
                                inputmode="numeric"
                                maxlength="1"
                                aria-label="인증번호 다섯 번째 자리"
                            >

                            <input
                                class="code-box verify-code-box"
                                type="text"
                                inputmode="numeric"
                                maxlength="1"
                                aria-label="인증번호 여섯 번째 자리"
                            >
                        </div>

                        <!-- 기존 Cognito 연동 입력 -->
                        <input
                            type="text"
                            id="verificationCode"
                            inputmode="numeric"
                            autocomplete="one-time-code"
                            maxlength="6"
                            pattern="[0-9]{6}"
                            required
                            tabindex="-1"
                            aria-label="전체 인증번호"
                        >

                        <!-- 인증 결과 메시지 -->
                        <div
                            id="verifyMessage"
                            class="verify-message"
                            role="status"
                            aria-live="polite"
                        ></div>

                        <!-- 인증 완료 버튼 -->
                        <button
                            type="submit"
                            id="verifyButton"
                            class="btn"
                            disabled
                        >
                            회원가입 하기
                        </button>

                    </form>

                    <!-- 인증번호 재발송 -->
                    <button
                        type="button"
                        id="resendButton"
                        class="resend-button"
                    >
                        인증번호 재발송
                    </button>

                </section>
            </div>
        </section>
    </main>

    <!-- 6자리 인증번호 UI 연동 -->
    <script>
        const codeBoxes = Array.from(
            document.querySelectorAll(".verify-code-box")
        );

        const verificationCode =
            document.getElementById("verificationCode");

        const verifyButton =
            document.getElementById("verifyButton");

        function updateVerificationCode() {
            const code = codeBoxes
                .map((box) => box.value)
                .join("");

            verificationCode.value = code;

            verificationCode.dispatchEvent(
                new Event("input", { bubbles: true })
            );

            verifyButton.disabled = !/^\d{6}$/.test(code);
        }

        codeBoxes.forEach((box, index) => {

            // 숫자 입력 및 자동 이동
            box.addEventListener("input", () => {
                const digits = box.value.replace(/\D/g, "");

                box.value = digits.slice(-1);

                if (
                    box.value &&
                    index < codeBoxes.length - 1
                ) {
                    codeBoxes[index + 1].focus();
                }

                updateVerificationCode();
            });

            // 백스페이스 / 방향키 이동
            box.addEventListener("keydown", (event) => {

                if (
                    event.key === "Backspace" &&
                    !box.value &&
                    index > 0
                ) {
                    codeBoxes[index - 1].focus();
                }

                if (
                    event.key === "ArrowLeft" &&
                    index > 0
                ) {
                    event.preventDefault();
                    codeBoxes[index - 1].focus();
                }

                if (
                    event.key === "ArrowRight" &&
                    index < codeBoxes.length - 1
                ) {
                    event.preventDefault();
                    codeBoxes[index + 1].focus();
                }
            });

            // 인증번호 전체 붙여넣기
            box.addEventListener("paste", (event) => {
                event.preventDefault();

                const text = event.clipboardData
                    .getData("text")
                    .replace(/\D/g, "")
                    .slice(0, 6);

                if (!text) return;

                codeBoxes.forEach((input, i) => {
                    input.value = text[i] || "";
                });

                const nextIndex = Math.min(
                    text.length,
                    codeBoxes.length - 1
                );

                codeBoxes[nextIndex].focus();

                updateVerificationCode();
            });
        });

        // Cognito 입력값이 변경되면 화면에 반영
        verificationCode.addEventListener("input", () => {
            const digits = verificationCode.value
                .replace(/\D/g, "")
                .slice(0, 6);

            codeBoxes.forEach((box, index) => {
                box.value = digits[index] || "";
            });

            verifyButton.disabled = digits.length !== 6;
        });
    </script>

    <!-- 기존 AWS Cognito 이메일 인증 -->
    <script
        type="module"
        src="../js/verify-email.js"
    ></script>

</body>
</html>
