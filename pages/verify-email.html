
<!doctype html>
<html lang="ko">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <meta name="description"
          content="이메일로 받은 인증번호를 입력해 가입을 마치세요.">
    <meta name="theme-color" content="#141414">

    <title>이메일 인증 | RecoMate</title>

    <link rel="stylesheet" href="../css/signup-design.css">
</head>

<body data-page="verify">

    <a class="sr-only" href="#main">본문 바로가기</a>

    <!-- 회원가입 페이지와 동일한 상단 메뉴 -->
    <header id="site-header" class="site-header">
        <div class="container">

            <a class="logo" href="index.html" aria-label="RecoMate 홈">
                <svg viewBox="0 0 24 24" fill="none"
                     stroke="currentColor" stroke-width="2"
                     stroke-linejoin="round" aria-hidden="true">
                    <path d="M3 7a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v2a2 2 0 0 0 0 4v2a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-2a2 2 0 0 0 0-4z"/>
                    <path d="M14 5v12" stroke-dasharray="2 2.5"/>
                </svg>
                RecoMate
            </a>

            <nav class="main-nav" aria-label="주요 메뉴">
                <a href="index.html">홈</a>
                <a href="#" aria-disabled="true"
                   title="준비 중입니다">요즘 대세</a>
                <a href="#" aria-disabled="true"
                   title="준비 중입니다">같이 추천받기</a>
                <a href="#" aria-disabled="true"
                   title="준비 중입니다">추천 기록</a>
            </nav>

            <div class="header-actions">
                <span class="icon-btn" role="img"
                      aria-label="검색 기능 준비 중">
                    <svg viewBox="0 0 24 24" fill="none"
                         stroke="currentColor" stroke-width="2"
                         stroke-linecap="round" aria-hidden="true">
                        <circle cx="11" cy="11" r="7"/>
                        <path d="M20 20l-3.5-3.5"/>
                    </svg>
                </span>

                <a class="avatar" href="profile.html"
                   aria-label="프로필">정</a>
            </div>

        </div>
    </header>

    <main id="main" class="auth">
        <div class="auth-card">
            <div class="card">

                <div class="auth-head">
                    <a class="logo" href="index.html">
                        <span>RecoMate</span>
                    </a>

                    <div class="steps-dots"
                         aria-label="2단계 중 2단계">
                        <i class="on"></i>
                        <i class="on"></i>
                    </div>

                    <h1>메일함을 확인해주세요</h1>

                    <p class="muted" style="margin:0">
                        <strong id="masked-email"
                                style="color:var(--text)"></strong>(으)로
                        <br>
                        6자리 인증번호를 보냈어요.
                    </p>
                </div>

                <div class="alert info" id="from-login"
                     hidden style="margin-bottom:16px">
                    가입 인증이 아직 끝나지 않았어요.
                    인증번호를 입력하면 가입이 완료돼요.
                </div>

                <form id="verify-form" novalidate>

                    <fieldset style="border:0;padding:0;margin:0">
                        <legend class="sr-only">
                            인증번호 6자리
                        </legend>

                        <div class="otp" id="otp">

                            <input
                                type="text"
                                inputmode="numeric"
                                autocomplete="one-time-code"
                                maxlength="6"
                                aria-label="1번째 숫자"
                            >

                            <input
                                type="text"
                                inputmode="numeric"
                                maxlength="1"
                                aria-label="2번째 숫자"
                            >

                            <input
                                type="text"
                                inputmode="numeric"
                                maxlength="1"
                                aria-label="3번째 숫자"
                            >

                            <input
                                type="text"
                                inputmode="numeric"
                                maxlength="1"
                                aria-label="4번째 숫자"
                            >

                            <input
                                type="text"
                                inputmode="numeric"
                                maxlength="1"
                                aria-label="5번째 숫자"
                            >

                            <input
                                type="text"
                                inputmode="numeric"
                                maxlength="1"
                                aria-label="6번째 숫자"
                            >

                        </div>
                    </fieldset>

                    <p
                        id="otp-msg"
                        role="status"
                        aria-live="polite"
                        class="muted"
                        style="text-align:center;font-size:14px;min-height:22px;margin:12px 0 0"
                    >
                        인증번호는 24시간 동안 쓸 수 있어요.
                    </p>

                    <button
                        class="btn btn-primary btn-block btn-lg"
                        id="verify-btn"
                        type="submit"
                        disabled
                        style="margin-top:12px"
                    >
                        인증하고 시작하기
                    </button>

                </form>

                <div class="row"
                     style="justify-content:center;margin-top:16px;gap:6px">

                    <span class="muted" style="font-size:14px">
                        메일이 안 왔나요?
                    </span>

                    <button
                        class="btn btn-ghost btn-sm"
                        id="resend"
                        type="button"
                        disabled
                    >
                        인증번호 다시 받기
                    </button>

                </div>

                <ul class="muted"
                    style="font-size:13px;margin:14px 0 0;padding-left:18px">
                    <li>스팸함·프로모션함도 확인해주세요.</li>
                    <li>
                        이메일을 잘못 입력했다면
                        <a class="link" href="signup.html">
                            이메일 주소 변경
                        </a>
                    </li>
                </ul>

            </div>
        </div>
    </main>

    <!-- 실제 AWS Cognito 인증 -->
    <script type="module" src="../js/verify-email.js"></script>

</body>
</html>
