<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>RecoMate 이메일 인증</title>

    <!-- Bootstrap 5 -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="../css/auth.css">
</head>

<body>

    <main class="login-container">

        <div class="login-box">

            <h1 class="logo">RecoMate</h1>

            <div class="verify-description">
                <p>이메일로 전송된 인증번호를 입력해주세요.</p>
            </div>

            <form id="verifyForm">

                <div class="mb-4">
                    <input
                        type="text"
                        class="form-control login-input"
                        id="verificationCode"
                        placeholder="인증번호를 입력하세요"
                        inputmode="numeric"
                        autocomplete="one-time-code"
                        required
                    >
                </div>

                <button
                    type="submit"
                    class="btn login-button w-100"
                >
                    인증하기
                </button>

            </form>

            <div class="verify-actions">

                <button
                    type="button"
                    id="resendButton"
                    class="link-button"
                >
                    인증번호 재전송
                </button>

                <a href="login.html" class="signup-link">
                    로그인으로 돌아가기
                </a>

            </div>

        </div>

    </main>

    <script src="../js/verify-email.js"></script>

</body>
</html>
