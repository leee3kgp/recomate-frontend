
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#08080d">

    <title>RecoMate | 이메일 인증</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="../css/auth.css">

    <style>
        /* =====================================
           기본 설정
        ===================================== */

        * {
            box-sizing: border-box;
        }

        body.verify-page {
            margin: 0;
            min-height: 100vh;
            font-family: 'Noto Sans KR', Arial, sans-serif;
            background: #b65c65;
            overflow-x: hidden;
        }

        /* =====================================
           움직이는 그라데이션 배경
        ===================================== */

        body.verify-page::before {
            content: "";
            position: fixed;
            inset: -35%;
            z-index: -1;

            background: linear-gradient(
                110deg,
                #91438f 0%,
                #aa507c 25%,
                #bf645d 50%,
                #d46e38 75%,
                #ed8516 100%
            );

            background-size: 200% 200%;

            animation: verifyGradient 16s ease-in-out infinite alternate;
        }

        @keyframes verifyGradient {
            0% {
                background-position: 0% 50%;
            }

            50% {
                background-position: 55% 35%;
            }

            100% {
                background-position: 100% 60%;
            }
        }

        /* =====================================
           전체 레이아웃
        ===================================== */

        .verify-page .signup-container {
            display: flex;
            align-items: center;
            justify-content: center;

            min-height: 100vh;
            padding: 35px 20px;

            background: transparent;
        }

        /* =====================================
           홈 버튼
        ===================================== */

        .verify-home {
            position: fixed;
            top: 35%;
            left: 3.2%;
            z-index: 10;

            display: inline-flex;
            align-items: center;
            justify-content: center;

            padding: 9px 14px;

            border-radius: 30px;
            background: #141414;

            color: #ffffff;
            font-size: 13px;
            text-decoration: none;
        }

        .verify-home:hover {
            background: #252525;
            color: #ffffff;
        }

        /* =====================================
           이메일 인증 카드
        ===================================== */

        .verify-page .signup-box {
            width: 100%;
            max-width: 425px;

            margin: 0;
            padding: 34px 40px 32px;

            border: 1px solid #292929;
            border-radius: 11px;

            background: #141414;
            color: #ffffff;

            box-shadow: 0 18px 40px rgba(0, 0, 0, 0.18);
        }

        /* =====================================
           RecoMate 로고
        ===================================== */

        .verify-page .signup-logo {
            margin: 0 0 8px;

            background: linear-gradient(
                100deg,
                #a443b8 0%,
                #cc617c 55%,
                #f08019 100%
            );

            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;

            font-size: 36px;
            font-weight: 400;
            letter-spacing: -1px;
            text-align: center;
        }

        /* =====================================
           진행 단계 2 / 2
        ===================================== */

        .verify-progress {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 9px;

            margin-bottom: 29px;
        }

        .verify-progress-line {
            width: 26px;
            height: 4px;
            border-radius: 10px;

            background: linear-gradient(
                90deg,
                #a33bb7,
                #f08019
            );
        }

        .verify-progress-text {
            margin-left: 6px;
            color: #999999;
            font-size: 13px;
        }

        /* =====================================
           이메일 인증 제목
        ===================================== */

        .verify-title {
            margin: 0 0 8px;

            color: #ffffff;
            font-size: 20px;
            font-weight: 700;
            text-align: center;
        }

        /* =====================================
           인증 안내
        ===================================== */

        .verify-info {
            margin: 0 0 25px;

            color: #aaaaaa;
            font-size: 14px;
            line-height: 1.55;
            text-align: center;
        }

        .verify-email-text {
            display: inline;
            margin: 0;

            color: #eeeeee;
            font-size: 14px;
            font-weight: 600;
            overflow-wrap: anywhere;
        }

        /* =====================================
           인증번호 입력칸
        ===================================== */

        .verify-code-group {
            display: flex;
            justify-content: space-between;
            gap: 8px;

            margin: 0 8px 36px;
        }

        .verify-code-box {
            width: 100%;
            min-width: 0;
            height: 57px;

            border: 1px solid #303030;
            border-radius: 9px;

            background: #000000;
            color: #ffffff;

            font-size: 23px;
            font-weight: 600;
            text-align: center;

            outline: none;
        }

        .verify-code-box:focus {
            border-color: #bc5ca6;
            box-shadow: 0 0 0 2px rgba(188, 92, 166, 0.15);
        }

        /* 기존 JS와 연결되는 실제 입력값 */
        #verificationCode {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            border: 0;
            opacity: 0;
            pointer-events: none;
        }

        /* =====================================
           인증 결과 메시지
        ===================================== */

        .verify-page .password-message {
            margin: 0;
            color: #aaaaaa;
            font-size: 12px;
            text-align: center;
        }

        .verify-page .password-message:empty {
            display: none;
        }

        .verify-page .password-message.success {
            color: #65d38c;
        }

        .verify-page .password-message.error {
            color: #ff7777;
        }

        /* =====================================
           회원가입 완료 버튼
        ===================================== */

        .verify-page .login-button {
            width: 100%;
            height: 46px;

            margin: 0;
            padding: 0;

            border: none;
            border-radius: 8px;

            background: linear-gradient(
                100deg,
                #a43bb7,
                #cb5e79,
                #f08019
            );

            color: #ffffff;
            font-size: 16px;
            font-weight: 700;
        }

        .verify-page .login-button:hover {
            filter: brightness(1.08);
            color: #ffffff;
        }

        .verify-page .login-button:disabled {
            background: #292929;
            color: #999999;
            opacity: 1;
            cursor: not-allowed;
        }

        /* =====================================
           재전송
        ===================================== */

        .verify-page .resend-button {
            display: block;

            width: auto;
            height: auto;

            margin: 19px auto 0;
            padding: 4px 8px;

            border: none;
            background: transparent;

            color: #999999;
            font-size: 13px;
            text-align: center;
        }

        .verify-page .resend-button:hover {
            background: transparent;
            color: #ffffff;
        }

        .verify-page .resend-button:disabled {
            color: #888888;
            opacity: 1;
            cursor: default;
        }

        /* =====================================
           모바일 반응형
        ===================================== */

        @media (max-width: 600px) {
            .verify-page .signup-container {
                padding: 75px 16px 30px;
            }

            .verify-page .signup-box {
                max-width: 425px;
                padding: 30px 22px;
            }

            .verify-home {
                top: 20px;
                left: 20px;
            }

            .verify-code-group {
                gap: 6px;
                margin-left: 0;
                margin-right: 0;
            }

            .verify-code-box {
                height: 52px;
                font-size: 20px;
            }

            .verify-page .signup-logo {
                font-size: 33px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            body.verify-page::before {
                animation: none;
            }
        }
    </style>
</head>

<body class="verify-page">

    <!-- 홈 버튼 -->
    <a href="index.html" class="verify-home">
        ← 홈
    </a>

    <main class="signup-container">

        <section class="signup-box">

            <!-- 로고 -->
            <h1 class="signup-logo">
                RecoMate
            </h1>

            <!-- 진행 단계 -->
            <div class="verify-progress">
                <span class="verify-progress-line"></span>
                <span class="verify-progress-line"></span>
                <span class="verify-progress-text">2 / 2</span>
            </div>

            <!-- 인증 제목 -->
            <h2 class="verify-title">
                이메일 인증
            </h2>

            <!-- 인증 안내 -->
            <p class="verify-info">
                <span id="verificationEmail"
                      class="verify-email-text"></span>로 발송된<br>
                인증번호를 입력하세요
            </p>

            <!-- 인증 폼 -->
            <form id="verifyForm">

                <!-- 6자리 입력 UI -->
                <div class="verify-code-group"
                     id="verifyCodeGroup">

                    <input class="verify-code-box"
                           type="text"
                           inputmode="numeric"
                           maxlength="1"
                           aria-label="인증번호 첫 번째 자리">

                    <input class="verify-code-box"
                           type="text"
                           inputmode="numeric"
                           maxlength="1"
                           aria-label="인증번호 두 번째 자리">

                    <input class="verify-code-box"
                           type="text"
                           inputmode="numeric"
                           maxlength="1"
                           aria-label="인증번호 세 번째 자리">

                    <input class="verify-code-box"
                           type="text"
                           inputmode="numeric"
                           maxlength="1"
                           aria-label="인증번호 네 번째 자리">

                    <input class="verify-code-box"
                           type="text"
                           inputmode="numeric"
                           maxlength="1"
                           aria-label="인증번호 다섯 번째 자리">

                    <input class="verify-code-box"
                           type="text"
                           inputmode="numeric"
                           maxlength="1"
                           aria-label="인증번호 여섯 번째 자리">

                </div>

                <!-- 기존 Cognito 인증용 입력 -->
                <input
                    type="text"
                    id="verificationCode"
                    inputmode="numeric"
                    autocomplete="one-time-code"
                    maxlength="6"
                    pattern="[0-9]{6}"
                    required
                    tabindex="-1"
                    aria-label="전체 인증번호"
                >

                <!-- 인증 결과 -->
                <div
                    id="verifyMessage"
                    class="password-message"
                    role="status"
                    aria-live="polite"
                ></div>

                <!-- 인증 버튼 -->
                <button
                    type="submit"
                    id="verifyButton"
                    class="btn login-button"
                    disabled
                >
                    회원가입 하기
                </button>

            </form>

            <!-- 재전송 -->
            <button
                type="button"
                id="resendButton"
                class="btn resend-button"
            >
                인증번호 재발송
            </button>

        </section>

    </main>

    <!-- 인증번호 입력 UI 연동 -->
    <script>
        const codeBoxes = Array.from(
            document.querySelectorAll(".verify-code-box")
        );

        const verificationCode =
            document.getElementById("verificationCode");

        const verifyButton =
            document.getElementById("verifyButton");

        function updateVerificationCode() {
            const code = codeBoxes
                .map(box => box.value)
                .join("");

            verificationCode.value = code;

            verificationCode.dispatchEvent(
                new Event("input", { bubbles: true })
            );

            verifyButton.disabled = !/^\d{6}$/.test(code);
        }

        codeBoxes.forEach((box, index) => {
            box.addEventListener("input", () => {
                const digits = box.value.replace(/\D/g, "");

                box.value = digits.slice(-1);

                if (box.value && index < codeBoxes.length - 1) {
                    codeBoxes[index + 1].focus();
                }

                updateVerificationCode();
            });

            box.addEventListener("keydown", (event) => {
                if (event.key === "Backspace" &&
                    !box.value &&
                    index > 0) {
                    codeBoxes[index - 1].focus();
                }

                if (event.key === "ArrowLeft" && index > 0) {
                    event.preventDefault();
                    codeBoxes[index - 1].focus();
                }

                if (event.key === "ArrowRight" &&
                    index < codeBoxes.length - 1) {
                    event.preventDefault();
                    codeBoxes[index + 1].focus();
                }
            });

            box.addEventListener("paste", (event) => {
                event.preventDefault();

                const text = event.clipboardData
                    .getData("text")
                    .replace(/\D/g, "")
                    .slice(0, 6);

                if (!text) return;

                codeBoxes.forEach((input, i) => {
                    input.value = text[i] || "";
                });

                const nextIndex = Math.min(
                    text.length,
                    codeBoxes.length - 1
                );

                codeBoxes[nextIndex].focus();

                updateVerificationCode();
            });
        });

        verificationCode.addEventListener("input", () => {
            const digits = verificationCode.value
                .replace(/\D/g, "")
                .slice(0, 6);

            codeBoxes.forEach((box, index) => {
                box.value = digits[index] || "";
            });

            verifyButton.disabled = digits.length !== 6;
        });
    </script>

    <!-- 기존 AWS Cognito 이메일 인증 -->
    <script
        type="module"
        src="../js/verify-email.js"
    ></script>

</body>
</html>
