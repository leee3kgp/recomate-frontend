
<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>RecoMate 이메일 인증</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="../css/auth.css">
</head>

<body>

    <main class="signup-container">
        <div class="signup-box">

            <h1 class="logo signup-logo">RecoMate</h1>

            <h5 class="text-center mb-3">
                이메일 인증
            </h5>

            <p class="text-center text-secondary">
                이메일로 발송된 인증번호를 입력해주세요.
            </p>

            <p
                id="verificationEmail"
                class="text-center"
            ></p>

            <form id="verifyForm">

                <div class="mb-3">
                    <input
                        type="text"
                        id="verificationCode"
                        class="form-control login-input"
                        placeholder="6자리 인증번호"
                        inputmode="numeric"
                        autocomplete="one-time-code"
                        maxlength="6"
                        pattern="[0-9]{6}"
                        required
                    >
                </div>

                <div
                    id="verifyMessage"
                    class="password-message"
                    role="status"
                    aria-live="polite"
                ></div>

                <button
                    type="submit"
                    id="verifyButton"
                    class="btn login-button w-100"
                >
                    이메일 인증하기
                </button>

            </form>

            <button
                type="button"
                id="resendButton"
                class="btn btn-outline-secondary w-100 mt-3"
            >
                인증번호 재발송
            </button>

            <div class="signup-area">
                <a href="login.html" class="signup-link">
                    로그인으로 돌아가기
                </a>
            </div>

        </div>
    </main>

    <script type="module" src="../js/verify-email.js"></script>

</body>
</html>
