
<!doctype html>
<html lang="ko">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <meta name="description"
          content="이메일로 받은 인증번호를 입력해 가입을 마치세요.">
    <meta name="theme-color" content="#141414">

    <title>이메일 인증 | RecoMate</title>

    <link rel="stylesheet" href="../css/signup-design.css">

    <style>
        /* 로그인 전 상단 네비게이션 */
        body[data-page="verify"] .site-header {
            height: 60px;
            background: #141414;
            border-bottom: 1px solid rgba(255,255,255,.08);
            position: sticky;
            top: 0;
            z-index: 40;
        }

        body[data-page="verify"] .site-header .container {
            width: min(100% - 32px, 1160px);
            height: 100%;
            margin-inline: auto;
            display: flex;
            align-items: center;
            gap: 28px;
        }

        body[data-page="verify"] .site-header .logo {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-size: 19px;
            font-weight: 700;
            line-height: 1.4;
            background: linear-gradient(90deg,#9b3fb5,#e57a14);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-decoration: none;
            white-space: nowrap;
        }

        body[data-page="verify"] .site-header .logo svg {
            width: 22px;
            height: 22px;
            flex: none;
        }

        body[data-page="verify"] .site-header .main-nav {
            display: flex;
            align-items: center;
            gap: 2px;
        }

        body[data-page="verify"] .site-header .main-nav a {
            padding: 8px 12px;
            border-radius: 8px;
            color: #c9c4c4;
            font-size: 14px;
            font-weight: 500;
            text-decoration: none;
        }

        body[data-page="verify"] .site-header .main-nav a:hover {
            color: #fff;
            background: #1b1b1b;
        }

        body[data-page="verify"] .site-header .header-actions {
            margin-left: auto;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        body[data-page="verify"] .site-header .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            height: 32px;
            padding: 0 12px;
            border: 1px solid transparent;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            line-height: 1;
            text-decoration: none;
            cursor: pointer;
        }

        body[data-page="verify"] .site-header .btn-ghost {
            background: transparent;
            color: #c9c4c4;
        }

        body[data-page="verify"] .site-header .btn-ghost:hover {
            background: #1b1b1b;
            color: #fff;
        }

        body[data-page="verify"] .site-header .btn-primary {
            background: linear-gradient(
                100deg,
                #793988 0%,
                #9e4d4b 52%,
                #c16311 100%
            );
            color: #fff;
        }

        @media (max-width: 860px) {
            body[data-page="verify"] .site-header .main-nav {
                display: none;
            }
        }

        @media (max-width: 480px) {
            body[data-page="verify"] .site-header .container {
                gap: 12px;
            }

            body[data-page="verify"] .site-header .logo {
                font-size: 17px;
            }
        }
    </style>
</head>

<body data-page="verify">

    <a class="sr-only" href="#main">본문 바로가기</a>

    <!-- 로그인 전 상단 메뉴 -->
    <header id="site-header" class="site-header">
        <div class="container">

            <a class="logo" href="index.html" aria-label="RecoMate 홈">
                <svg viewBox="0 0 24 24"
                     width="22" height="22"
                     fill="none"
                     stroke="#e57a14"
                     stroke-width="2"
                     stroke-linejoin="round"
                     aria-hidden="true">
                    <path d="M3 7a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v2a2 2 0 0 0 0 4v2a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-2a2 2 0 0 0 0-4z"/>
                    <path d="M14 5v12" stroke-dasharray="2 2.5"/>
                </svg>
                RecoMate
            </a>

            <nav class="main-nav" aria-label="주요 메뉴">
                <a href="start.html">같이 추천받기</a>
            </nav>

            <div class="header-actions">
                <a class="btn btn-ghost btn-sm" href="login.html">
                    로그인
                </a>
                <a class="btn btn-primary btn-sm" href="signup.html">
                    회원가입
                </a>
            </div>

        </div>
    </header>

    <main id="main" class="auth">
        <div class="auth-card">
            <div class="card">

                <div class="auth-head">
                    <a class="logo" href="index.html">
                        <span>RecoMate</span>
                    </a>

                    <div class="steps-dots"
                         aria-label="2단계 중 2단계">
                        <i class="on"></i>
                        <i class="on"></i>
                    </div>

                    <h1>메일함을 확인해주세요</h1>

                    <p class="muted" style="margin:0">
                        <strong id="masked-email"
                                style="color:var(--text)"></strong>(으)로
                        <br>
                        6자리 인증번호를 보냈어요.
                    </p>
                </div>

                <div class="alert info" id="from-login"
                     hidden style="margin-bottom:16px">
                    가입 인증이 아직 끝나지 않았어요.
                    인증번호를 입력하면 가입이 완료돼요.
                </div>

                <form id="verify-form" novalidate>

                    <fieldset style="border:0;padding:0;margin:0">
                        <legend class="sr-only">
                            인증번호 6자리
                        </legend>

                        <div class="otp" id="otp">

                            <input
                                type="text"
                                inputmode="numeric"
                                autocomplete="one-time-code"
                                maxlength="6"
                                aria-label="1번째 숫자"
                            >

                            <input
                                type="text"
                                inputmode="numeric"
                                maxlength="1"
                                aria-label="2번째 숫자"
                            >

                            <input
                                type="text"
                                inputmode="numeric"
                                maxlength="1"
                                aria-label="3번째 숫자"
                            >

                            <input
                                type="text"
                                inputmode="numeric"
                                maxlength="1"
                                aria-label="4번째 숫자"
                            >

                            <input
                                type="text"
                                inputmode="numeric"
                                maxlength="1"
                                aria-label="5번째 숫자"
                            >

                            <input
                                type="text"
                                inputmode="numeric"
                                maxlength="1"
                                aria-label="6번째 숫자"
                            >

                        </div>
                    </fieldset>

                    <p
                        id="otp-msg"
                        role="status"
                        aria-live="polite"
                        class="muted"
                        style="text-align:center;font-size:14px;min-height:22px;margin:12px 0 0"
                    >
                        인증번호는 24시간 동안 쓸 수 있어요.
                    </p>

                    <button
                        class="btn btn-primary btn-block btn-lg"
                        id="verify-btn"
                        type="submit"
                        disabled
                        style="margin-top:12px"
                    >
                        인증하고 시작하기
                    </button>

                </form>

                <div class="row"
                     style="justify-content:center;margin-top:16px;gap:6px">

                    <span class="muted" style="font-size:14px">
                        메일이 안 왔나요?
                    </span>

                    <button
                        class="btn btn-ghost btn-sm"
                        id="resend"
                        type="button"
                        disabled
                    >
                        인증번호 다시 받기
                    </button>

                </div>

                <ul class="muted"
                    style="font-size:13px;margin:14px 0 0;padding-left:18px">
                    <li>스팸함·프로모션함도 확인해주세요.</li>
                    <li>
                        이메일을 잘못 입력했다면
                        <a class="link" href="signup.html">
                            이메일 주소 변경
                        </a>
                    </li>
                </ul>

            </div>
        </div>
    </main>

    <!-- 기존 AWS Cognito 이메일 인증 기능 유지 -->
    <script type="module" src="../js/verify-email.js"></script>

</body>
</html>
