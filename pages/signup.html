
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >
    <meta name="theme-color" content="#141414">

    <title>RecoMate | 회원가입</title>

    <!-- 공통 글꼴 -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >
    <link
        href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <!-- 공통 디자인 시스템 -->
    <link rel="stylesheet" href="../css/common.css">
    <link rel="stylesheet" href="../css/toast.css">

    <!-- 기존 인증 화면 디자인 -->
    <link rel="stylesheet" href="../css/background.css">
    <link rel="stylesheet" href="../css/auth.css">

    <style>
        /* =========================================
           RecoMate 회원가입
           Issue #45
        ========================================= */

        .stage {
            position: relative;
            z-index: 1;

            min-height: 100vh;

            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;

            padding: 40px 20px;
        }

        .view {
            width: 100%;

            display: flex;
            flex-direction: column;
            align-items: center;

            animation: fade 0.45s ease both;
        }

        @keyframes fade {
            from {
                opacity: 0;
                transform: translateY(8px);
            }

            to {
                opacity: 1;
                transform: none;
            }
        }

        /* ---------- 홈 버튼 ---------- */

        .back {
            position: fixed;
            top: 22px;
            left: 26px;
            z-index: 5;

            display: inline-flex;
            align-items: center;
            gap: 6px;

            padding: 7px 14px 7px 10px;

            background: #141414;
            color: #e8e8e8;

            border: 1px solid #2c2c2c;
            border-radius: 999px;

            font-family: var(--font-main);
            font-size: 13px;
            text-decoration: none;

            transition: border-color 150ms ease;
        }

        .back:hover {
            border-color: #777;
        }

        /* ---------- 회원가입 카드 ---------- */

        .auth {
            width: min(400px, 100%);

            padding: 28px clamp(22px, 9%, 38px) 24px;

            background: var(--panel);
            border: 1px solid #262626;
            border-radius: 10px;

            box-shadow: 0 14px 50px rgba(0, 0, 0, 0.35);

            animation: cardUp 0.55s
                cubic-bezier(0.2, 0.7, 0.2, 1) both;
        }

        @keyframes cardUp {
            from {
                opacity: 0;
                transform: translateY(18px);
            }

            to {
                opacity: 1;
                transform: none;
            }
        }

        /* ---------- 로고 ---------- */

        .brand {
            margin: 0;

            text-align: center;
            font-size: 34px;
            font-weight: 400;
            letter-spacing: 0.5px;
            line-height: 1.2;
        }

        .brand a {
            background: var(--brand);

            -webkit-background-clip: text;
            background-clip: text;

            color: transparent;
            text-decoration: none;
        }

        /* ---------- 진행 단계 ---------- */

        .steps {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 9px;

            margin: 10px 0 22px;
        }

        .step-line {
            width: 27px;
            height: 4px;

            border-radius: 999px;
            background: #343434;
        }

        .step-line.active {
            background: var(--brand);
        }

        .step-label {
            margin-left: 5px;

            color: #999;
            font-size: 12px;
        }

        /* ---------- 입력 그룹 ---------- */

        .fg {
            margin-bottom: 13px;
        }

        .fg label {
            display: block;
            margin: 0 0 6px 2px;

            color: #bdbdbd;
            font-size: 12px;
            font-weight: 400;
        }

        .field {
            display: block;

            width: 100%;
            height: 42px;

            padding: 0 13px;

            background: #000;
            color: #ececec;

            border: 1px solid #2c2c2c;
            border-radius: var(--r);
            outline: none;

            font-family: var(--font-main);
            font-size: 14px;

            transition: border-color 150ms ease;
        }

        .field::placeholder {
            color: #7d7d7d;
        }

        .field:hover {
            border-color: #444;
        }

        .field:focus {
            border-color: transparent;

            background:
                linear-gradient(#000, #000) padding-box,
                var(--brand) border-box;
        }

        /* ---------- 비밀번호 입력 ---------- */

        .pw {
            position: relative;
        }

        .pw .field {
            padding-right: 42px;
        }

        .eye {
            position: absolute;
            right: 8px;
            top: 50%;

            transform: translateY(-50%);

            display: grid;
            place-items: center;

            width: 30px;
            height: 30px;

            padding: 0;

            background: none;
            border: 0;
            border-radius: 6px;

            color: #8d8d8d;
            cursor: pointer;
        }

        .eye:hover {
            color: #fff;
        }

        .eye svg {
            width: 18px;
            height: 18px;

            fill: none;
            stroke: currentColor;
            stroke-width: 1.8;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        /* ---------- 비밀번호 조건 ---------- */

        .password-rules {
            display: flex;
            flex-wrap: wrap;
            gap: 5px 9px;

            margin-top: 8px;
            font-size: 11px;
        }

        .password-rule {
            color: #777;
            white-space: nowrap;
        }

        .password-rule.valid {
            color: #6fc59a;
        }

        .password-rule.invalid {
            color: #d76a76;
        }

        .password-warning,
        .password-message,
        .signup-message {
            margin: 0;

            font-size: 12px;
            line-height: 1.5;
        }

        .password-warning:not(:empty),
        .password-message:not(:empty),
        .signup-message:not(:empty) {
            margin-top: 6px;
        }

        .password-warning,
        .password-message.error,
        .signup-message.error {
            color: #ef8181;
        }

        .password-message.success,
        .signup-message.success {
            color: #6fc59a;
        }

        .signup-message {
            text-align: center;
        }

        /* ---------- 회원가입 버튼 ---------- */

        .auth .btn {
            display: flex;
            align-items: center;
            justify-content: center;

            width: 100%;
            height: 42px;

            margin-top: 18px;
            padding: 0 16px;

            border: 0;
            border-radius: var(--r);

            background: var(--brand);
            color: #fff;

            font-family: var(--font-main);
            font-size: 15px;
            font-weight: 600;

            cursor: pointer;
            transition: filter 150ms ease;
        }

        .auth .btn:hover:not(:disabled) {
            filter: brightness(1.12);
        }

        .auth .btn:disabled {
            background: #2a2a2a;
            color: #8a8a8a;
            cursor: not-allowed;
        }

        /* ---------- 로그인 링크 ---------- */

        .alt {
            display: flex;
            justify-content: flex-end;
            margin-top: 14px;
        }

        .text-link {
            color: #a8a8a8;
            font-size: 13px;

            text-decoration: underline;
            text-underline-offset: 4px;
        }

        .text-link:hover {
            color: #fff;
        }

        /* ---------- 모바일 ---------- */

        @media (max-width: 560px) {
            .stage {
                justify-content: flex-start;
                padding: 70px 16px 24px;
            }

            .auth {
                padding: 28px 22px 24px;
            }

            .brand {
                font-size: 30px;
            }

            .back {
                position: static;
                align-self: flex-start;
                margin-bottom: 12px;
            }

            .password-rules {
                font-size: 10px;
            }
        }

        /* ---------- 모션 접근성 ---------- */

        @media (prefers-reduced-motion: reduce) {
            .view,
            .auth {
                animation: none;
            }
        }
    </style>
</head>

<body class="signup-page" data-mode="auth">

    <!-- 기존 그라데이션 배경 -->
    <div class="fx" aria-hidden="true">
        <div class="fxin">
            <i></i>
        </div>
    </div>

    <div class="fxn" aria-hidden="true"></div>

    <main>
        <section class="stage">
            <div class="view">

                <!-- 홈으로 돌아가기 -->
                <a href="index.html" class="back">
                    ← 홈
                </a>

                <!-- 회원가입 카드 -->
                <section class="auth">

                    <h1 class="brand">
                        <a href="index.html">
                            RecoMate
                        </a>
                    </h1>

                    <!-- 진행 단계 -->
                    <div
                        class="steps"
                        aria-label="회원가입 1단계 / 2단계"
                    >
                        <span class="step-line active"></span>
                        <span class="step-line"></span>
                        <span class="step-label">1 / 2</span>
                    </div>

                    <form id="signupForm">

                        <!-- 닉네임 -->
                        <div class="fg">
                            <label for="nickname">
                                닉네임
                            </label>

                            <input
                                class="field"
                                type="text"
                                id="nickname"
                                name="nickname"
                                placeholder="사용할 닉네임을 작성하세요"
                                maxlength="40"
                                autocomplete="nickname"
                                required
                            >
                        </div>

                        <!-- 이메일 -->
                        <div class="fg">
                            <label for="userId">
                                아이디(이메일)
                            </label>

                            <input
                                class="field"
                                type="email"
                                id="userId"
                                name="email"
                                placeholder="아이디(이메일)를 입력하세요"
                                autocomplete="email"
                                required
                            >
                        </div>

                        <!-- 비밀번호 -->
                        <div class="fg">
                            <label for="password">
                                비밀번호
                            </label>

                            <div class="pw">
                                <input
                                    class="field"
                                    type="password"
                                    id="password"
                                    name="password"
                                    placeholder="사용할 비밀번호를 입력하세요"
                                    autocomplete="new-password"
                                    minlength="12"
                                    required
                                >

                                <button
                                    type="button"
                                    class="eye password-toggle"
                                    data-target="password"
                                    aria-label="비밀번호 표시"
                                    aria-pressed="false"
                                >
                                    <svg
                                        viewBox="0 0 24 24"
                                        aria-hidden="true"
                                    >
                                        <path
                                            d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12z"
                                        ></path>
                                        <circle
                                            cx="12"
                                            cy="12"
                                            r="3"
                                        ></circle>
                                    </svg>
                                </button>
                            </div>

                            <!-- 비밀번호 조건 -->
                            <div
                                class="password-rules"
                                id="passwordRules"
                            >
                                <span
                                    id="ruleLength"
                                    class="password-rule"
                                >
                                    ○ 12자 이상
                                </span>

                                <span
                                    id="ruleLowercase"
                                    class="password-rule"
                                >
                                    ○ 소문자 포함
                                </span>

                                <span
                                    id="ruleNumber"
                                    class="password-rule"
                                >
                                    ○ 숫자 포함
                                </span>

                                <span
                                    id="ruleSpecial"
                                    class="password-rule"
                                >
                                    ○ 특수문자 포함
                                </span>
                            </div>

                            <div
                                id="passwordWarning"
                                class="password-warning"
                                role="status"
                                aria-live="polite"
                            ></div>
                        </div>

                        <!-- 비밀번호 확인 -->
                        <div class="fg">
                            <label for="passwordConfirm">
                                비밀번호 확인
                            </label>

                            <div class="pw">
                                <input
                                    class="field"
                                    type="password"
                                    id="passwordConfirm"
                                    name="passwordConfirm"
                                    placeholder="비밀번호를 확인하세요"
                                    autocomplete="new-password"
                                    required
                                >

                                <button
                                    type="button"
                                    class="eye password-toggle"
                                    data-target="passwordConfirm"
                                    aria-label="비밀번호 확인 표시"
                                    aria-pressed="false"
                                >
                                    <svg
                                        viewBox="0 0 24 24"
                                        aria-hidden="true"
                                    >
                                        <path
                                            d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12z"
                                        ></path>
                                        <circle
                                            cx="12"
                                            cy="12"
                                            r="3"
                                        ></circle>
                                    </svg>
                                </button>
                            </div>

                            <div
                                id="passwordMessage"
                                class="password-message"
                                aria-live="polite"
                            ></div>
                        </div>

                        <!-- 회원가입 결과 -->
                        <div
                            id="signupMessage"
                            class="signup-message"
                            role="status"
                            aria-live="polite"
                        ></div>

                        <button
                            class="btn"
                            type="submit"
                            id="signupButton"
                        >
                            회원가입 하기
                        </button>

                    </form>

                    <!-- 로그인으로 돌아가기 -->
                    <div class="alt">
                        <a
                            href="login.html"
                            class="text-link"
                        >
                            로그인으로 돌아가기
                        </a>
                    </div>

                </section>
            </div>
        </section>
    </main>

    <!-- 기존 AWS Cognito 회원가입 기능 -->
    <script
        type="module"
        src="../js/signup.js"
    ></script>

    <!-- 비밀번호 표시 / 숨기기 -->
    <script>
        document.querySelectorAll(".password-toggle")
            .forEach((button) => {
                button.addEventListener("click", () => {
                    const input = document.getElementById(
                        button.dataset.target
                    );

                    if (!input) return;

                    const visible =
                        input.type === "password";

                    input.type =
                        visible ? "text" : "password";

                    button.setAttribute(
                        "aria-pressed",
                        String(visible)
                    );

                    button.setAttribute(
                        "aria-label",
                        visible
                            ? "비밀번호 숨기기"
                            : "비밀번호 표시"
                    );
                });
            });
    </script>

</body>
</html>
