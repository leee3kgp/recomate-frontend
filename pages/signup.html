
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>RecoMate 회원가입</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="../css/auth.css">

    <style>
        /* 비밀번호 조건 가로 정렬 */
        .password-rules {
            display: flex;
            flex-direction: row;
            flex-wrap: wrap;
            align-items: center;
            gap: 8px 14px;
            margin-top: 12px;
            margin-bottom: 12px;
            font-size: 13px;
        }

        .password-rule {
            color: #888;
            white-space: nowrap;
        }

        .password-rule.valid {
            color: #198754;
        }

        .password-rule.invalid {
            color: #dc3545;
        }

        /* 비밀번호 경고문 */
        .password-warning {
            color: #dc3545;
            font-size: 13px;
            margin-bottom: 12px;
            text-align: left;
        }

        .password-message {
            font-size: 13px;
            margin-bottom: 12px;
            text-align: left;
        }

        .password-message.success {
            color: #198754;
        }

        .password-message.error {
            color: #dc3545;
        }

        .signup-message {
            font-size: 13px;
            margin-bottom: 12px;
            text-align: center;
        }

        .signup-message.error {
            color: #dc3545;
        }

        .signup-message.success {
            color: #198754;
        }
    </style>
</head>

<body>

    <main class="signup-container">

        <div class="signup-box">

            <h1 class="logo signup-logo">RecoMate</h1>

            <form id="signupForm">

                <!-- 닉네임 -->
                <div class="mb-3">
                    <input
                        type="text"
                        id="nickname"
                        class="form-control login-input"
                        placeholder="사용할 닉네임을 입력하세요"
                        required
                    >
                </div>

                <!-- 이메일 -->
                <div class="mb-3">
                    <input
                        type="email"
                        id="userId"
                        class="form-control login-input"
                        placeholder="아이디(이메일)를 입력하세요"
                        required
                    >
                </div>

                <!-- 비밀번호 -->
                <div class="mb-2">
                    <input
                        type="password"
                        id="password"
                        class="form-control login-input"
                        placeholder="사용할 비밀번호를 입력하세요"
                        autocomplete="new-password"
                        minlength="12"
                        required
                    >
                </div>

                <!-- 비밀번호 조건: 가로 정렬 -->
                <div class="password-rules" id="passwordRules">

                    <span id="ruleLength" class="password-rule">
                        ○ 12자 이상
                    </span>

                    <span id="ruleLowercase" class="password-rule">
                        ○ 소문자 포함
                    </span>

                    <span id="ruleNumber" class="password-rule">
                        ○ 숫자 포함
                    </span>

                    <span id="ruleSpecial" class="password-rule">
                        ○ 특수문자 포함
                    </span>

                </div>

                <!-- 비밀번호 조건 경고문 -->
                <div
                    id="passwordWarning"
                    class="password-warning"
                    role="status"
                    aria-live="polite"
                ></div>

                <!-- 비밀번호 확인 -->
                <div class="mb-3">
                    <input
                        type="password"
                        id="passwordConfirm"
                        class="form-control login-input"
                        placeholder="확인 비밀번호를 입력하세요"
                        required
                    >
                </div>

                <!-- 비밀번호 일치 확인 -->
                <div
                    id="passwordMessage"
                    class="password-message"
                    aria-live="polite"
                ></div>

                <!-- 회원가입 결과 -->
                <div
                    id="signupMessage"
                    class="signup-message"
                    role="status"
                    aria-live="polite"
                ></div>

                <!-- 회원가입 버튼 -->
                <button
                    type="submit"
                    id="signupButton"
                    class="btn login-button signup-button w-100"
                >
                    아이디 생성하기
                </button>

            </form>

            <div class="signup-area">
                <a href="login.html" class="signup-link">
                    로그인으로 돌아가기
                </a>
            </div>

        </div>

    </main>

    <script type="module" src="../js/signup.js"></script>

</body>
</html>
