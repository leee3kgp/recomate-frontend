<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>RecoMate 회원가입</title>

    <!-- Bootstrap 5 -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- 공통 CSS -->
    <link rel="stylesheet" href="../css/auth.css">
</head>

<body>

    <main class="signup-container">

        <div class="signup-box">

            <!-- 로고 -->
            <h1 class="logo signup-logo">RecoMate</h1>

            <form id="signupForm">

                <!-- 1. 닉네임 -->
                <div class="mb-3">
                    <input
                        type="text"
                        id="nickname"
                        class="form-control login-input"
                        placeholder="사용할 닉네임을 입력하세요"
                        required
                    >
                </div>

                <!-- 2. 아이디 + 중복확인 -->
                <div class="id-row">

                    <input
                        type="text"
                        id="userId"
                        class="form-control login-input id-input"
                        placeholder="사용할 아이디를 입력하세요"
                        required
                    >

                    <button
                        type="button"
                        id="checkIdButton"
                        class="btn check-button"
                    >
                        중복확인
                    </button>

                </div>

                <!-- 중복확인 결과 -->
                <div
                    id="idCheckMessage"
                    class="id-check-message"
                ></div>

                <!-- 3. 비밀번호 -->
                <div class="mb-3">
                    <input
                        type="password"
                        id="password"
                        class="form-control login-input"
                        placeholder="사용할 비밀번호를 입력하세요"
                        required
                    >
                </div>

                <!-- 4. 비밀번호 확인 -->
                <div class="mb-4">
                    <input
                        type="password"
                        id="passwordConfirm"
                        class="form-control login-input"
                        placeholder="확인 비밀번호를 입력하세요"
                        required
                    >
                </div>

                <!-- 비밀번호 확인 결과 -->
                <div
                    id="passwordMessage"
                    class="password-message"
                ></div>

                <!-- 회원가입 버튼 -->
                <button
                    type="submit"
                    class="btn login-button signup-button w-100"
                >
                    아이디 생성하기
                </button>

            </form>

            <!-- 로그인으로 돌아가기 -->
            <div class="signup-area">
                <a href="login.html" class="signup-link">
                    로그인으로 돌아가기
                </a>
            </div>

        </div>

    </main>

    <script src="../js/signup.js"></script>

</body>

</html>
